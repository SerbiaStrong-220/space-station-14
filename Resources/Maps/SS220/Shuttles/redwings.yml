        [bold]Документ ЦК-НТ-ИНТ-РВ-001[/bold]


        [head=2]Межкорпоративное соглашение о допуске и осуществлении деятельности[/head]

        [head=3]Центральное Командование NanoTrasen - Interdyne Pharmaceutics[/head]


        [italic]Дата заключения: 06.04.2569 [/italic]  

        [italic]Статус: Действующее разрешение[/italic]  

        [italic]Гриф: Для служебного пользования[/italic]


        Настоящим Центральное Командование NanoTrasen подтверждает предоставление компании Interdyne Pharmaceutics разрешения на осуществление медицинской и спасательной деятельности в пределах секторов, находящихся под юрисдикцией NanoTrasen, силами специализированного отряда экстренного реагирования «Красные Крылья» (Red Wings).


        [bold]1. Предмет соглашения[/bold]



        Отряду Red Wings предоставляется право осуществлять медицинскую, диагностическую и спасательную деятельность в пределах секторов, находящихся под юрисдикцией NanoTrasen, с использованием собственного транспорта, вооружения, оборудования и медицинских ресурсов.

        В рамках своей деятельности сотрудники отряда вправе оказывать экстренную медицинскую помощь, проводить стабилизацию состояния пациентов, выполнять хирургические вмешательства, осуществлять медицинские обследования и диагностику, а также проводить последующую реабилитацию и наблюдение за состоянием клиентов.


        Помимо этого, Red Wings вправе осуществлять продажу медикаментов, медицинских препаратов, расходных материалов и предоставлять иные медицинские услуги на коммерческой основе в соответствии с внутренними тарифами Interdyne Pharmaceutics.

        Условия оказания услуг, включая их стоимость, объём и приоритетность, определяются внутренними регламентами компании и условиями заключённых страховых контрактов. Экстренная помощь, спасение и эвакуация в рамках страхового обслуживания предоставляются клиентам с действующим страховым покрытием. Оказание прочих медицинских услуг может осуществляться на платной основе независимо от наличия страхового контракта.


        [bold]2. Условия деятельности[/bold]



        Учитывая специфику деятельности отряда, сотрудникам Red Wings разрешается иметь при себе и применять штатное вооружение, а также использовать специальные средства защиты и снаряжение, необходимые для обеспечения безопасности сотрудников и выполнения контрактных обязательств.

        Основной задачей вооружённого состава является обеспечение безопасного доступа к клиенту, защита медицинского персонала и сопровождение эвакуации. При возникновении препятствий сотрудники отряда должны по возможности отдавать предпочтение предупреждениям, переговорам и несмертельным средствам воздействия.

        Вместе с тем, любые попытки воспрепятствовать оказанию медицинской помощи или эвакуации застрахованного клиента, включая его необоснованное удержание, сокрытие местонахождения, блокирование доступа к нему или применение силы в отношении сотрудников отряда, рассматриваются как вмешательство в исполнение контрактных обязательств Interdyne Pharmaceutics.

        В подобных обстоятельствах Red Wings вправе применять необходимые меры силового воздействия, вплоть до применения летального вооружения, независимо от принадлежности, должности или корпоративного статуса лица, препятствующего выполнению операции. Данное право распространяется на всех лиц без исключения, включая представителей иных корпораций и частных лиц.

        Сотрудники отряда не обязаны отказываться от эвакуации клиента или прекращать операцию исключительно на основании требований третьих лиц, если такие требования не имеют достаточных оснований и препятствуют выполнению условий страхового контракта.


        При этом наличие действующего страхового контракта не обязывает Red Wings осуществлять эвакуацию клиента при любых обстоятельствах. Если действия клиента свидетельствуют о выраженной психической нестабильности, неконтролируемой агрессии или утрате способности контролировать собственное поведение, сопровождающихся массовым насилием, нападениями на персонал либо созданием непосредственной угрозы жизни окружающих, такой клиент может быть признан источником критической угрозы общественной безопасности.

        К подобным обстоятельствам, в частности, относятся случаи массовых нападений, неконтролируемых агрессивных состояний, вызванных психоневрологическими нарушениями, а также иные состояния, при которых эвакуация клиента способна повлечь дальнейшие жертвы или создать угрозу безопасности самого отряда и окружающих.


        В подобных случаях Red Wings оставляет за собой право отказать в эвакуации, приостановить оказание услуг или прекратить операцию. Решение принимается ответственным составом отряда исходя из характера угрозы, текущей обстановки и возможных последствий вмешательства.


        [bold]3. Взаимодействие с персоналом NanoTrasen[/bold]



        Red Wings осуществляют деятельность в соответствии с внутренними протоколами Interdyne Pharmaceutics и условиями страховых контрактов. Решения о порядке оказания помощи, стабилизации и эвакуации клиентов принимаются непосредственно ответственным составом отряда с учётом обстоятельств конкретной операции.


        NanoTrasen сохраняет право контролировать соблюдение действующих правил и требований безопасности на объектах, находящихся под её юрисдикцией. При этом оперативная деятельность Red Wings не должна необоснованно ограничиваться, если она осуществляется в рамках настоящего соглашения.


        [bold]4. Разрешение спорных ситуаций[/bold]



        В случае возникновения разногласий, спорных обстоятельств или конфликтов между представителями сторон каждая из сторон обязана незамедлительно связаться со своим непосредственным командованием и запросить дальнейшие инструкции по урегулированию ситуации.

        До получения указаний стороны должны, по возможности, воздерживаться от действий, способных привести к дальнейшей эскалации конфликта, за исключением случаев, когда незамедлительное вмешательство необходимо для предотвращения угрозы жизни и здоровью людей либо обеспечения безопасности объекта.


        [bold]5. Ответственность сторон[/bold]



        Interdyne Pharmaceutics самостоятельно несёт ответственность за действия своих сотрудников, сохранность собственного имущества и последствия проводимых операций.


        NanoTrasen не несёт ответственности за финансовые обязательства Interdyne Pharmaceutics перед её клиентами, а также за внутренние расходы и убытки отряда Red Wings.


        [bold]6. Срок действия и отзыв разрешения[/bold]



        Настоящее соглашение вступает в силу с момента подписания и действует до момента его официального отзыва Центральным Командованием NanoTrasen либо расторжения по взаимному соглашению сторон.


        Центральное Командование оставляет за собой право приостановить или отозвать разрешение в случае систематического нарушения условий настоящего соглашения либо возникновения угрозы безопасности объектов и персонала NanoTrasen.


        [bold]Дополнительные полномочия и гарантии оперативного состава Red Wings[/bold]


        Сотрудники отряда Red Wings, допущенные к осуществлению деятельности на объектах NanoTrasen в соответствии с настоящим соглашением, не подлежат задержанию или привлечению к ответственности за действия, предусмотренные статьями 100, 102, 106, 108, 202, 204, 208, 302, 304, 308 и 502 Космического закона, если такие действия были непосредственно связаны с исполнением служебных обязанностей, необходимостью защиты клиента, обеспечением безопасности оперативного состава или проведением эвакуации.

        К указанным обстоятельствам относятся, в частности, применение физической силы и специальных средств, использование штатного вооружения, проникновение в зоны ограниченного доступа, вскрытие преград и причинение сопутствующего материального ущерба, если подобные действия были обусловлены характером операции и не выходили за пределы необходимой меры воздействия.


        Применение летального вооружения, в том числе повлёкшее гибель третьих лиц, допускается в случаях открытого вооружённого или физического нападения на сотрудников Red Wings либо их клиента, а также при силовом воспрепятствовании эвакуации, создающем непосредственную угрозу жизни, здоровью или срыва операции. При подобных обстоятельствах действия сотрудников отряда, включая причинение нападавшему смертельных повреждений, рассматриваются как допустимая мера обеспечения выполнения служебных обязательств.


        Действие настоящего положения не распространяется на умышленные преступления, совершённые вне рамок служебной деятельности, а также на действия, не имеющие непосредственной связи с выполнением контрактных обязательств. Сам факт принадлежности к отряду Red Wings не освобождает сотрудника от ответственности за злоупотребление предоставленными полномочиями.


        В случае возникновения сомнений относительно правомерности действий сотрудника обстоятельства инцидента подлежат рассмотрению уполномоченными представителями NanoTrasen и Interdyne Pharmaceutics с обязательным обращением к командованию обеих сторон.



