    - type: Paper
      content: >-
        Ваш шаттл не будет давать функционировать: магниту обломков, консоли экспедиций, ну а если вам понадобиться экспедиция, просто берите диск с той консоли и вставляйте сюда, хватит таскать эту грёбанную консоль идиотины. 


        И посмейте только ломать стенки, под ними нихрена нет.


        Подстанция вашего корабля заботливо выключена, все вам на блюдичке подавай, ага щас, конечно, жизнь не мёд и тут где то напольная бомба, бойтесь её, хотелось бы конечно чтобы она вам руки оторвала взрывом, кривые руки любящие всё ломать только завидя что тут могло бы быть просторней, ВОН БЛЯХА УБЕРИТЕ СТЕЛЛАЖИ И БУДЕТ ВАМ ПРОСТОРНО.


        А и забыл упомянуть, у вас на жопе огромный двигатель, из-за него ваш шаттл очень быстрый, разгонитесь и вам пиздец, остановиться на этой махине почти невозможно если вы не прикрепите еще новых тормозов. Двигатель предназначен для полёта на далекий от нас Лаваленд, если этот двигатель будет использоваться в корыстных целях... Пеняйте на себя, он каким то образом может сам взорваться из-за сверхскоростей
