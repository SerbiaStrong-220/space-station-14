- type: entity
  parent: BaseHeaterMachine
  id: KitchenElectricGrill
  name: electric grill
  description: A microwave? No, a real man cooks steaks on a grill!
  components:
  - type: Sprite
    # TODO: draw a sprite
    sprite: Structures/Machines/electric_grill.rsi
    drawdepth: SmallObjects
    snapCardinals: true
    layers:
    - state: icon
    - map: ["enum.EntityHeaterVisuals.Setting"]
      shader: unshaded
      visible: false
  - type: ApcPowerReceiver
    powerLoad: 0 # off by default
  - type: EntityHeater
    settingSound:
      path: /Audio/Weapons/click.ogg
      params:
        volume: -6
  - type: ItemPlacer
    maxEntities: 4 # big grill, many steaks
    whitelist:
      components:
      - Temperature
      - Grillable #SS220-grill-update-2
      - Edible #SS220-overcook-update
  - type: PlaceableSurface
  - type: Machine
    board: ElectricGrillMachineCircuitboard
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.EntityHeaterVisuals.Setting:
        enum.EntityHeaterVisuals.Setting:
          Off: { visible: false }
          Low: { visible: true, state: low }
          Medium: { visible: true, state: medium }
          High: { visible: true, state: high }
  #SS220-grill-update-2 begin
  - type: Grill
    grillingSprite: { sprite: SS220/Effects/grillingEffect.rsi, state: grillingSmoke }
  #SS220-grill-update end
  # SS220 kitchen-machinery-destruction begin
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DamageAllContainedEntitiesBehavior # Damage everything that is inside
        damage:
          types:
            Blunt: 50 # Enough to destroy the glass sheet
      - !type:EmptyAllContainersBehaviour # Drop everything that is inside
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 3
          CableApcStack1:
            min: 1
            max: 1
  # SS220 kitchen-machinery-destruction end
