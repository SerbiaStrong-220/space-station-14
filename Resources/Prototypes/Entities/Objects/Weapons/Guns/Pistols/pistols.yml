- type: entity
  name: BasePistol
  parent: BaseItem
  id: BaseWeaponPistol
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/SS220/Effects/Drop/pistol.ogg
      params:
        volume: 2
  - type: Sprite
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedOffset: 0,-4
  - type: Tag
    tags:
    - Sidearm
  - type: Clothing
    sprite: Objects/Weapons/Guns/Pistols/viper.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Gun
    canSuicide: true ##SS220-new-feature kus
    minAngle: 5 #SS220 weapon overhaul
    maxAngle: 19 #SS220 weapon overhaul
    fireRate: 6
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/pistol_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistol
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistol
            - MagazinePistolHighCapacity
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: AmmoCounter
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 500

- type: entity
  name: viper
  parent: [BaseWeaponPistol, BaseGunWieldable] #SS220 weapon overhaul
  id: WeaponPistolViper
  description: A common handgun illegally modified by the Syndicate. The Viper sports a selector switch between semi-auto and ‘rock and roll’. The standard sidearm for any soldier who fights under the three serpents. Feeds from .35 pistol magazines.
  components:
  - type: Sprite
    sprite: SS220/Objects/Weapons/Guns/Pistols/viper.rsi #SS220 weapon overhaul
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolHighCapacity
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistol
            - MagazinePistolHighCapacity
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 1000
  #SS220 weapon overhaul start
  - type: Gun
    canSuicide: true
    minAngle: 9
    maxAngle: 15
    fireRate: 6
    angleDecay: 2
    angleIncrease: 1.05
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
      - FullAuto
  - type: GunAimable
    minAngle: -5
    maxAngle: -3
  - type: GunWieldBonus
    minAngle: -3
    maxAngle: -6
    angleIncrease: -0.4
    angleDecay: 2
  #SS220 weapon overhaul end

- type: entity
  name: echis
  parent: [ BaseItem]
  id: WeaponPistolEchis
  description: A cyborg-mounted weapon system based on the Viper pistol. Creates ammunition on the fly from an internal fabricator, which slowly self-charges.
  components:
  #SS220 weapon overhaul start
  - type: GunAimable
    minAngle: -5
    maxAngle: -9
  #SS220 weapon overhaul end
  - type: Gun
    fireRate: 6
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/viper.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgePistol
    capacity: 10
    proto: CartridgePistol
    cycleable: false # No synthesizing ammo for your syndicate masters.
  - type: BallisticAmmoSelfRefiller
    autoRefillRate: 2s
    affectedByEmp: true
  - type: AmmoCounter

- type: entity
  name: cobra
  parent: [BaseWeaponPistol, BaseGunWieldable] #SS220 weapon overhaul
  id: WeaponPistolCobra
  description: Integrally suppressed semi-automatic pistol used by the Syndicate, firing caseless subsonic rounds. Favored by any agent who likes to keep things quiet and leave no evidence behind. Feeds from .25 pistol magazines.
  components:
  #SS220 weapon overhaul start
  - type: Gun
    canSuicide: true
    minAngle: 9
    maxAngle: 15
    fireRate: 4
    angleDecay: 2
    angleIncrease: 1.05
    selectedMode: SemiAuto
    muzzleFlashSupressed: true
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
      params:
        volume: -4
    availableModes:
      - SemiAuto
  - type: GunAimable
    minAngle: -5
    maxAngle: -3
  - type: GunWieldBonus
    minAngle: -3
    maxAngle: -8
    angleIncrease: -0.4
    angleDecay: 2
  #SS220 weapon overhaul end
  - type: Sprite
    sprite: SS220/Objects/Weapons/Guns/Pistols/cobra.rsi #SS220 weapon overhaul
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Pistols/cobra.rsi
  - type: ChamberMagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolCaselessRifle
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistolCaselessRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgeCaselessRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 1500

- type: entity
  name: mk 58
  parent: [BaseWeaponPistol, BaseGunWieldable, BaseSecurityContraband] #SS220 weapon overhaul
  id: WeaponPistolMk58
  description: Designed by Nanotrasen’s Small Arms Division, the Mk58 is a conventional semi-automatic pistol with a simple recoil-operated action and excellent reliability. The standard sidearm of Nanotrasen’s station security and emergency response teams. Feeds from .35 pistol magazines.
  components:
  - type: Sprite
    sprite: SS220/Objects/Weapons/Guns/Pistols/mk58.rsi #SS220 weapon overhaul
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Pistols/mk58.rsi
  - type: ChamberMagazineAmmoProvider
    soundBoltClosed:
      path: /Audio/SS220/Weapons/Guns/Bolt/mk_slide_closed.ogg # SS220 MK Resound by Rivgane
    soundBoltOpened:
      path: /Audio/SS220/Weapons/Guns/Bolt/mk_slide_open.ogg # SS220 MK Resound by Rivgane
    soundRack:
      path: /Audio/SS220/Weapons/Guns/Cock/mk_cock.ogg # SS220 MK Resound by Rivgane
  - type: Item
    storedOffset: 0,-2
  #SS220 weapon overhaul start
  - type: Gun
    canSuicide: true
    minAngle: 9
    maxAngle: 15
    fireRate: 5
    angleDecay: 2
    angleIncrease: 1.05
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundMode:
      path: /Audio/SS220/Weapons/Guns/Misc/mk_selector.ogg # SS220 MK Resound by Rivgane (though it is unused)
    soundGunshot:
      path: /Audio/SS220/Weapons/Guns/Gunshots/mk_shot.ogg # SS220 MK Resound by Rivgane
    soundEmpty: /Audio/SS220/Weapons/Guns/Empty/mk_dryfire.ogg # SS220 MK Resound by Rivgane
  - type: GunAimable
    minAngle: -5
    maxAngle: -3
  - type: GunWieldBonus
    minAngle: -3
    maxAngle: -8
    angleIncrease: -0.4
    angleDecay: 2
  #SS220 weapon overhaul end
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistol
        insertSound: /Audio/SS220/Weapons/Guns/MagIn/mk_magin.ogg # SS220 MK Resound by Rivgane
        ejectSound: /Audio/SS220/Weapons/Guns/MagOut/mk_magout.ogg # SS220 MK Resound by Rivgane
        priority: 2
        whitelist:
          tags:
            - MagazinePistol
            - MagazinePistolHighCapacity
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
  - type: StealTarget
    stealGroup: OfficerHandgun

