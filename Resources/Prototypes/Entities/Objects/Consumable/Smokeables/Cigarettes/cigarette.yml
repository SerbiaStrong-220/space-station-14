- type: entity
  id: CigaretteSpent
  parent: Cigarette
  suffix: spent
  components:
  - type: Sprite
    state: burnt-icon
  - type: Smokable
    state: Burnt
  - type: SolutionContainerManager
    solutions:
      smokable:
        maxVol: 20
      food: #SS220-Eat-Cigarettes-begin
        maxVol: 20
        reagents:
        - ReagentId: GastroToxin
          Quantity: 1
  - type: Edible # ss220 edible cigarettes
  - type: FlavorProfile
    flavors:
      - punishment #SS220-Eat-Cigarettes-end
  - type: Tag
    tags:
      - Cigarette
      - Trash
      - Burnt

