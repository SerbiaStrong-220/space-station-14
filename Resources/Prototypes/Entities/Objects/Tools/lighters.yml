- type: entity
  abstract: true
  parent: [SolutionWelder, BaseItem]
  id: BaseLighter
  name: basic lighter
  components:
  - type: IgnitionSource
    ignited: false
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: lighterOnSounds
    soundDeactivate:
      collection: lighterOffSounds
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Heat: 1
  - type: ItemToggleSize
    activatedSize: Small
  - type: ItemToggleHot
  - type: Sprite
    sprite: SS220/Objects/Tools/Lighters/lighters.rsi #SS220 lighters_resprite
    layers:
    - state: icon_map
    - state: cheap_icon_base
      map: [ "skin" ]
    - state: basic_icon_top
    #SS220 lighters_resprite start
    - state: basic_piston
      visible: false
      map: [ "piston" ]
    #SS220 lighters_resprite end
    - state: lighter_flame
      visible: false
      shader: unshaded
      map: [ "flame" ]
  - type: Appearance
  - type: RandomSprite
    available:
      - skin:
          basic_icon_base-1: ""
          basic_icon_base-2: ""
          basic_icon_base-3: ""
          basic_icon_base-4: ""
          basic_icon_base-5: ""
          basic_icon_base-6: ""
          basic_icon_base-7: ""
          basic_icon_base-8: ""
          basic_icon_base-9: ""
          basic_icon_base-10: ""
          basic_icon_base-11: ""
          #SS220 lighters_resprite start
          basic_icon_base-12: ""
          basic_icon_base-13: ""
          basic_icon_base-14: ""
          basic_icon_base-15: ""
          basic_icon_base-16: ""
          basic_icon_base-17: ""
          basic_icon_base-18: ""
          basic_icon_base-19: ""
          basic_icon_base-20: ""
          basic_icon_base-21: ""
          basic_icon_base-22: ""
          basic_icon_base-23: ""
          basic_icon_base-24: ""
          basic_icon_base-25: ""
          basic_icon_base-26: ""
          basic_icon_base-27: ""
          basic_icon_base-28: ""
          basic_icon_base-29: ""
          basic_icon_base-30: ""
          #SS220 lighters_resprite end
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        flame:
          True: { visible: true }
          False: { visible: false }
  #SS220 lighters_resprite start
        piston:
          True: { visible: false }
          False: { visible: true }
  #SS220 lighters_resprite end
  - type: ToggleableVisuals
    spriteLayer: lighter_flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
  - type: Item
    size: Tiny
    sprite: SS220/Objects/Tools/Lighters/lighters.rsi #SS220 lighters_resprite
  - type: UseDelay
  - type: RefillableSolution
    solution: Welder
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
      types:
        Blunt: 0
  - type: Welder
    fuelConsumption: 0.01
    fuelLitCost: 0.1
    tankSafe: true
  - type: PointLight
    enabled: false
    netsync: false
    radius: 1.1 #smallest possible
    color: orange
  - type: ItemTogglePointLight
  - type: Tag # SS220 cigarette pack fix beginning
    tags:
      - Lighter # SS220 cigarette pack fix end
  - type: PhysicalComposition

- type: entity
  abstract: true
  parent: [SolutionWelder, SolutionToolVeryTiny]
  id: SolutionLighter
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 7.5

## Basic

- type: entity
  parent: [SolutionLighter, BaseLighter]
  id: Lighter
  name: basic lighter
  description: A simple plastic cigarette lighter.
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/lighters.rsi
    layers:
    - state: icon_map
    - state: cheap_icon_base
      map: [ "skin" ]
    - state: basic_icon_top
    - state: lighter_flame
      visible: false
      shader: unshaded
      map: [ "flame" ]
  - type: RandomSprite
    available:
      - skin:
          basic_icon_base-1: ""
          basic_icon_base-2: ""
          basic_icon_base-3: ""
          basic_icon_base-4: ""
          basic_icon_base-5: ""
          basic_icon_base-6: ""
          basic_icon_base-7: ""
          basic_icon_base-8: ""
          basic_icon_base-9: ""
          basic_icon_base-10: ""
          basic_icon_base-11: ""
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
  - type: Item
    sprite: Objects/Tools/Lighters/lighters.rsi

- type: entity
  parent: Lighter
  id: CheapLighter
  name: cheap lighter
  description: "A dangerously inexpensive plastic lighter. Don't burn your thumb!"
  components:
  - type: Sprite
    sprite: SS220/Objects/Tools/Lighters/lighters.rsi #SS220 lighters_resprite
    layers:
    - state: icon_map
    #SS220 lighters_resprite start
    - state: icon-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    #SS220 lighters_resprite end
    - state: cheap_icon_base
      map: [ "skin" ]
    - state: cheap_icon_top
    #SS220 lighters_resprite start
    - state: cheap_piston
      visible: false
      map: [ "piston" ]
    #SS220 lighters_resprite end
    - state: lighter_flame
      visible: false
      shader: unshaded
      map: [ "flame" ]
  - type: RandomSprite
    available:
      - skin:
          cheap_icon_base: Rainbow
  - type: Solution
    solution:
      maxVol: 4 #uses less fuel than a welder, so this isnt as bad as it looks
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 4
  - type: Welder
    fuelConsumption: 0.02
    fuelLitCost: 0.2
  #SS220 lighters_resprite start
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: icon-
  #SS220 lighters_resprite end

- type: entity
  parent: [ SolutionLighter, BaseLighter ]
  id: DiscountDanLighter
  name: Discount Dan's lighter
  description: The worst lighter ever produced. Lighter burn is inevitable, do not refuel while lit.
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/lighters.rsi
    layers:
    - state: icon_map
    - state: discount_icon_base
    - state: basic_icon_top
    - state: lighter_flame
      visible: false
      shader: unshaded
      map: [ "flame" ]
  - type: Welder # the single worst lighter invented by mankind
    fuelConsumption: 0.4
    fuelLitCost: 0.2
    tankSafe: false
  - type: Item
    sprite: Objects/Tools/Lighters/lighters.rsi
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
  - type: PointLight
    radius: 1.5
    color: yellow
  - type: ComponentToggler
    components:
    - type: DamageOnHolding # todo this needs to make a sound or something to tell people it's burning them
      damage:
        types:
          Heat: 2

## Flippos

- type: entity
  abstract: true
  parent: [SolutionToolWelderMini, BaseLighter]
  id: BaseBrandedLighter
  components:
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/Items/Lighters/zippo_open.ogg
      params:
        volume: -5
    soundDeactivate:
      path: /Audio/Items/Lighters/zippo_close.ogg
      params:
        volume: -5
  - type: Sprite
    layers:
    - state: icon
      map: [ "base" ]
    - state: top
      map: [ "top" ]
      visible: false
    - state: open
      map: [ "open" ]
      visible: false
    - state: flame
      map: [ "flame" ]
      visible: false
      shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        open:
          True: { visible: true }
          False: { visible: false }
        top:
          True: { visible: true }
          False: { visible: false }
        base:
          True: { visible: false }
          False: { visible: true }
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-lit
        shader: unshaded
      right:
      - state: inhand-right-lit
        shader: unshaded
  - type: PointLight
    radius: 1.5 #slightly stronger than the other lighters

