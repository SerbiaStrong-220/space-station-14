- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: HoloparasiteInjector
  name: holoparasite injector
  description: A complex artwork of handheld machinery allowing the user to host a holoparasite guardian.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    state: combat_hypo
  - type: GuardianCreator
    guardianProto: MobHoloparasiteGuardian
# SS220-hidden-desc-begin
  - type: HiddenDescription
    entries:
      SyndicateAgentKnowledge: [ corvax-hidden-desc-HoloparasiteInjector-syndicate ]
      ScienceKnowledge: [ corvax-hidden-desc-HoloparasiteInjector-research ]
      MedicalKnowledge: [ corvax-hidden-desc-IllegalImplants-medical ]
    nameEntries:
    - [SyndicateAgentKnowledge, null]
    - [ScienceKnowledge, null]
    - [MedicalKnowledge, ent-HoloparasiteInjector]
    hiddenName: ent-HoloparasiteInjector
# SS220-hidden-desc-end

- type: entity
