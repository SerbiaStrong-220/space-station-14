# Uplinks
- type: entity
  parent: [BaseItem, StorePresetUplink]
  id: BaseUplinkRadio
  name: syndicate uplink
  description: Suspiciously looking old radio...
  suffix: Empty
  components:
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: old-radio
  - type: Item
    sprite: Objects/Devices/communication.rsi
    heldPrefix: old-radio
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    balance:
      Telecrystal: 0

- type: entity
  parent: BaseUplinkRadio
  id: BaseUplinkRadio20TC
  suffix: 200 TC #SS220-uplink-200tc
  components:
  - type: Store
    balance:
      Telecrystal: 200 #SS220-uplink-200tc

- type: entity
  parent: BaseUplinkRadio
  id: BaseUplinkRadio25TC
  suffix: 250 TC #SS220-uplink-200tc
  components:
  - type: Store
    balance:
      Telecrystal: 250 #SS220-uplink-200tc

#this uplink MUST be used for nukeops, as it has the tag for filtering the listing.
- type: entity
  parent: BaseUplinkRadio
  id: BaseUplinkRadio40TC
  suffix: 400 TC, NukeOps #SS220-uplink-200tc
  components:
  - type: Store
    categories:
#SS220 NukeOpsUplink begin
    - UplinkWeaponry
    - UplinkAmmo
    - UplinkExplosives
    - UplinkChemicals
    - UplinkDeception
    - UplinkDisruption
    - UplinkImplants
    - UplinkChemicalImplants # SS220 - chemical-implants
    - UplinkAllies
    - UplinkWearables
    - UplinkPointless
#SS220 NukeOpsUplink end
    balance:
      Telecrystal: 400 #SS220-uplink-200tc
    useDiscounts: true # SS220 Lone-Ops-Uplink
  - type: Tag
    tags:
    - NukeOpsUplink

- type: entity
  parent: BaseUplinkRadio
  id: LoneOpsUplinkRadio40TC # SS220 Lone-Ops-Uplink
  suffix: 400 TC, LoneOps #SS220-uplink-200tc
  components:
  - type: Store
    categories:
#SS220 NukeOpsUplink begin
    - UplinkWeaponry
    - UplinkAmmo
    - UplinkExplosives
    - UplinkChemicals
    - UplinkDeception
    - UplinkDisruption
    - UplinkImplants
    - UplinkChemicalImplants # SS220 - chemical-implants
    - UplinkAllies
    - UplinkWearables
    - UplinkPointless
#SS220 NukeOpsUplink end
    balance:
      Telecrystal: 400 #SS220-uplink-200tc
    useDiscounts: true # SS220 Lone-Ops-Uplink
  - type: Tag
    tags:
    - LoneOpsUplink # SS220 Lone-Ops-Uplink

- type: entity
  parent: BaseUplinkRadio
