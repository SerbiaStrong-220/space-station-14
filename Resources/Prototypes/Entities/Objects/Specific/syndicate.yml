
- type: entity
  name: telecrystal
  parent: [BaseItem]
  id: Telecrystal
  suffix: 200 TC #SS220-uplink-200tc
  description: It seems to be pulsing with suspiciously enticing energies.
  components:
  - type: Sprite
    sprite: Objects/Specific/Syndicate/telecrystal.rsi
    state: telecrystal
  - type: Item
    sprite: Objects/Specific/Syndicate/telecrystal.rsi
    size: Tiny
  - type: Stack
    count: 200 #SS220-uplink-200tc
    stackType: Telecrystal
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 20 #SS220-uplink-200tc
  - type: Currency
    price:
      Telecrystal: 1
# SS220-hidden-desc-begin
  - type: HiddenDescription
    entries:
      SyndicateAgentKnowledge: [ corvax-hidden-desc-Telecrystal-syndicate ]
      ScienceKnowledge: [ corvax-hidden-desc-Telecrystal-research ]
      CargoKnowledge: [ corvax-hidden-desc-Telecrystal-cargo ]
    nameEntries:
    - [SyndicateAgentKnowledge, null]
    - [ScienceKnowledge, null]
    - [CargoKnowledge, null]
    hiddenName: ent-Telecrystal
# SS220-hidden-desc-end

