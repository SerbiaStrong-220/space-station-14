- type: antag
  id: Thief
  name: roles-antag-thief-name
  antagonist: true
  setPreference: true
  objective: roles-antag-thief-objective
  guides: [ Thieves ]
  #SS220 Add antags playtime trackers begin
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 20h # 20h SS220 time
  playTimeTracker: AntagThief
  #SS220 Add antags playtime trackers end

- type: antagSpecifier
  parent: RestrictedAntag
  id: Thief
  prefRoles:
  - Thief
  allowNonHumans: true
  multiAntagSetting: NotExclusive
  startingGear: ThiefGear
  components:
  - type: Pacified
  - type: Thieving
    stripTimeReduction: 2
    stealthy: true
  mindRoles:
  - MindRoleThief
  briefing:
    sound: "/Audio/Misc/thief_greeting.ogg"

- type: startingGear
  id: ThiefGear
  storage:
    back:
    - ThiefBeacon
    - SatchelThief
