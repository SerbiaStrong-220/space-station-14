- type: entity
  parent: [ CrateSyndicate, StorePresetUplink, BaseSyndicateContraband ]
  id: CrateSyndicateSurplusBundle
  name: Syndicate surplus crate
  description: Contains 500 telecrystals worth of completely random Syndicate items. It can be useless junk or really good. #SS220-uplink-200tc
  components:
    - type: SurplusBundle
      totalPrice: 500 #SS220-uplink-200tc

- type: entity
  parent: CrateSyndicate
  id: CrateCybersunJuggernautBundle
  name: Cybersun juggernaut bundle
  suffix: Filled
  description: Contains everything except a big gun to go postal.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingOuterHardsuitJuggernaut
        - !type:NestedSelector
          tableId: SyndicateHardsuitExtrasEntityTable

- type: entity
  parent: [ CrateSyndicate, StorePresetUplink, BaseSyndicateContraband ]
  id: CrateSyndicateSuperSurplusBundle
  name: Syndicate super surplus crate
  description: Contains 1250 telecrystals worth of completely random Syndicate items. #SS220-uplink-200tc
  components:
    - type: SurplusBundle
      totalPrice: 1250 #SS220-uplink-200tc
