- type: entity
  id: ActionToggleAGhostBodyVisuals
  name: Скрыть тело
  description: Скрыть тело призрака, оставив только шляпу.
  components:
  - type: Action
    icon: { sprite: Mobs/Ghosts/ghost_human.rsi, state: icon }
    checkCanInteract: false
  - type: InstantAction
    event: !type:ToggleAGhostBodyVisualsActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionGhostHudSettings
  name: Настройки визоров
  description: Выбрать, какие визоры отображаются у призрака.
  components:
  - type: Action
    icon: { sprite: Clothing/Eyes/Hud/sec.rsi, state: icon }
  - type: InstantAction
    event: !type:ToggleIntrinsicUIEvent { key: enum.GhostHudUiKey.Key }
