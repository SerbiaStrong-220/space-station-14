- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceSynth
  categories: [ HideSpawnMenu ]
  name: synth appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganRoboticTorso
      Head: OrganRoboticHead
      ArmLeft: OrganRoboticArmLeft
      ArmRight: OrganRoboticArmRight
      HandRight: OrganRoboticHandRight
      HandLeft: OrganRoboticHandLeft
      LegLeft: OrganRoboticLegLeft
      LegRight: OrganRoboticLegRight
      FootLeft: OrganRoboticFootLeft
      FootRight: OrganRoboticFootRight
  - type: HumanoidProfile
    species: Human

- type: entity
  abstract: true
  parent:
  - BaseMob
  - MobCombat
  - MobPolymorphable
  - StripableInventoryBase
  - BaseSpeciesAppearance
  id: BaseSpeciesMobAlternative
  save: false
  components:
  - type: DamageVisuals
    thresholds: [ 10, 20, 30, 50, 70, 100 ]
    targetLayers:
    - "enum.HumanoidVisualLayers.Chest"
    - "enum.HumanoidVisualLayers.Head"
    - "enum.HumanoidVisualLayers.LArm"
    - "enum.HumanoidVisualLayers.LLeg"
    - "enum.HumanoidVisualLayers.RArm"
    - "enum.HumanoidVisualLayers.RLeg"
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#FF0000"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: JobStatus
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: HumanoidProfile
  - type: TypingIndicator
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 185
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FloorOcclusion
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MeatBulletImpact
    soundTypes:
      Heat:
        collection:
          MeatLaserImpact
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [Touch, Ingestion]
    reactions:
    - reagents: [Water, SpaceCleaner]
      methods: [Touch]
      effects:
      - !type:WashCreamPie
  - type: StatusEffects
    allowed:
    - Electrocution
    - PressureImmunity
    - TemporaryBlindness
    - Pacified
    - Flashed
  - type: Identity
  - type: IdExaminable
  - type: FloatingVisuals
  - type: Climbing
  - type: Cuffable
  - type: Ensnareable
    sprite: Objects/Misc/ensnare.rsi
    state: icon
  - type: AnimationPlayer
  - type: Buckle
  - type: CombatMode
    canDisarm: true
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 5
  - type: TTS # Corvax-TTS
  - type: SleepEmitSound
  - type: StandingState
  - type: Crawler
  - type: MindContainer
  - type: CanEnterCryostorage
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others
  - type: CanHostGuardian
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_human
  - type: ParcelWrapOverride
    parcelPrototype: WrappedParcelHumanoid
    wrapDelay: 5
  - type: Stripping
  - type: HeadsetToggled
  - type: Headset
  - type: EncryptionKeyHolder
    showOnExamine: false
    keySlots: 10
    keysExtractionMethod: Prying
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.SurgeryEdgeSelectorUi.Key:
        type: EdgeSelectorBUI
      enum.HeadsetKey.Key:
        type: HeadsetBoundUserInterface
  - type: Puller
  - type: Speech
    speechSounds: Alto
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: MaleHuman
  - type: Emoting
    chatEmoteCooldown: 5.0
  - type: BodyEmotes
    soundsId: GeneralBodyEmotes
  - type: Grammar
    attributes:
      proper: true
  - type: MobPrice
    price: 1500
    deathPenalty: 0.01
  - type: MartialArtist
  - type: MartialArtsTarget
  - type: Grabber
  - type: Grabbable
  - type: GrabResistance
  - type: RandomPrice
    maxRandomPrice: 20000
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost

- type: entity
  parent: [BaseSpeciesMobAlternative, StripableInventoryBase]
  id: BaseMobSilicon
  abstract: true
  save: false
  components:
  - type: InstastunResist
    active: true
    resistedStunTypes: [Creampie]
  #- type: Flammable
  - type: Experience
  - type: IgnoreDisarmOnDamageSkill
  - type: Reactive
    groups:
      Acidic: [Touch]
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CombatMode
  - type: StaticPrice
    price: 1250
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 4.5
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      300: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
    showOverlays: false
    allowRevives: true
  - type: HealthExaminable
    examinableTypes:
      - Blunt
      - Slash
      - Piercing
      - Heat
      - Shock
    locPrefix: silicon
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.SurgeryEdgeSelectorUi.Key:
        type: EdgeSelectorBUI
      enum.HeadsetKey.Key:
        type: HeadsetBoundUserInterface
      enum.SiliconUiKey.Key:
        type: SiliconBoundUserInterface
  - type: ActivatableUI
    key: enum.HeadsetKey.Key
  - type: Inventory
    templateId: borg
  - type: Hands
  - type: ComplexInteraction
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
    - Common
    - Science
  - type: ActiveRadio
    channels:
    - Binary
    - Common
    - Science
  - type: ZombieImmune
  - type: Repairable
    damageValue: -10 # 10 seconds to repair from crit
    doAfterDelay: 1
    fuelCost: 0.5
    allowSelfRepair: false
  - type: WiresPanel
  - type: ActivatableUIRequiresPanel
  - type: ContainerContainer
    containers:
      borg_brain: !type:ContainerSlot { }
      cell_slot: !type:ContainerSlot { }
      borg_module: !type:Container { }
      part-container: !type:Container
      key_slots: !type:Container
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: true
  - type: PowerCellDraw
    drawRate: 0
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        blacklist:
          tags:
          - E-N
  - type: Body
  - type: StatusEffects
    allowed:
    - Flashed
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
  - type: Vocal
    sounds:
      Unsexed: UnisexSilicon
    wilhelmProbability: 0
  - type: DamagedSiliconAccent
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepBoots
  - type: Lock
    locked: true
    unlockOnClick: false
    lockOnClick: false
    onlyOwnerCanUnlock: true
    breakOnAccessBreaker: false
  - type: ItemSlotsLock
    slots:
      - cell_slot
  - type: UIRequiresLock
    userInterfaceKeys:
    - enum.SiliconUiKey.Key
    blacklist:
      tags:
      - NoConsoleSound
  - type: LockedWiresPanel
  - type: Damageable
    damageContainer: Silicon
    damageModifierSet: Silicon
  - type: Blindable
  - type: ExplosionResistance
    damageCoefficient: 0.7
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers:
        - borg_brain
        - borg_module
        - cell_slot
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Pullable
  - type: Puller
    needsHands: true
  - type: StandingState
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - CanPilot
    - SiliconEmotes
    - Unimplantable
    - Synthetic
  - type: Emoting
  - type: GuideHelp
    guides:
    - Cyborgs
    - Robotics
  - type: TTS
    randomVoicesList: Borg
  - type: ProtectedFromStepTriggers
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10 # capable of touching light bulbs and stoves without feeling pain!
  - type: BypassLock
    openWiresPanel: true
  - type: BypassLockRequiresMobState
    requiredMobState:
    - Critical
    - Dead
  - type: MindTrailIgnore
  - type: Language
    availableLanguages:
    - id: Galactic
    - id: Binary
    - id: Universal

