# Artificial limbs. Each arm and leg comes with its hand or foot attached.

- type: entity
  abstract: true
  id: BaseProsthesis
  components:
  - type: Prosthesis
  # no skin, so no markings either
  - type: VisualOrganMarkings
    markingData:
      group: None

- type: entity
  abstract: true
  parent: BaseProsthesis
  id: BaseProsthesisWooden
  components:
  # wood breaks apart in a blast easier than flesh
  - type: Prosthesis
    explosionDismemberModifier: 1.5
  - type: Sprite
    sprite: SS220/Mobs/Prosthetics/wooden.rsi
  - type: VisualOrgan
    data:
      sprite: SS220/Mobs/Prosthetics/wooden.rsi
      # without a color the body layer keeps the skin color of the limb it replaces
      color: "#FFFFFF"

- type: entity
  parent: [ OrganBaseArmLeft, BaseProsthesisWooden ]
  id: ProsthesisWoodenArmLeft
  name: wooden left arm
  components:
  - type: ContainerFill
    containers:
      limb_attached_organs:
      - ProsthesisWoodenHandLeft

- type: entity
  parent: [ OrganBaseArmRight, BaseProsthesisWooden ]
  id: ProsthesisWoodenArmRight
  name: wooden right arm
  components:
  - type: ContainerFill
    containers:
      limb_attached_organs:
      - ProsthesisWoodenHandRight

- type: entity
  parent: [ OrganBaseHandLeft, BaseProsthesisWooden ]
  id: ProsthesisWoodenHandLeft
  name: wooden left hand
  components:
  # a hook can't hold a gun
  - type: HandOrgan
    handID: left
    data:
      location: Left
      blacklist:
        components:
        - Gun

- type: entity
  parent: [ OrganBaseHandRight, BaseProsthesisWooden ]
  id: ProsthesisWoodenHandRight
  name: wooden right hand
  components:
  # a hook can't hold a gun
  - type: HandOrgan
    handID: right
    data:
      location: Right
      blacklist:
        components:
        - Gun

- type: entity
  parent: [ OrganBaseLegLeft, BaseProsthesisWooden ]
  id: ProsthesisWoodenLegLeft
  name: wooden left leg
  components:
  - type: Prosthesis
    speedModifier: 0.9
  - type: ContainerFill
    containers:
      limb_attached_organs:
      - ProsthesisWoodenFootLeft

- type: entity
  parent: [ OrganBaseLegRight, BaseProsthesisWooden ]
  id: ProsthesisWoodenLegRight
  name: wooden right leg
  components:
  - type: Prosthesis
    speedModifier: 0.9
  - type: ContainerFill
    containers:
      limb_attached_organs:
      - ProsthesisWoodenFootRight

- type: entity
  parent: [ OrganBaseFootLeft, BaseProsthesisWooden ]
  id: ProsthesisWoodenFootLeft
  name: wooden left foot

- type: entity
  parent: [ OrganBaseFootRight, BaseProsthesisWooden ]
  id: ProsthesisWoodenFootRight
  name: wooden right foot

- type: entity
  abstract: true
  parent: BaseProsthesis
