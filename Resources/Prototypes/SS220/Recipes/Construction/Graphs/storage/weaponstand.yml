- type: constructionGraph
  id: WeaponStand
  start: start
  graph:
  - node: start
    edges:
    - to: WeaponStandNode
      steps:
      - material: WoodPlank
        amount: 5
        doAfter: 2
      - material: Steel
        amount: 2
        doAfter: 2

  - node: WeaponStandNode
    entity: WeaponStand
    edges:
    - to: start
      steps:
      - tool: Screwing
        doAfter: 5
      conditions:
      - !type:ContainerEmpty
        container: "ItemCabinet"
      completed:
      - !type:SpawnPrototype
        prototype: MaterialWoodPlank1
        amount: 3
      - !type:EmptyAllContainers
      - !type:DeleteEntity
