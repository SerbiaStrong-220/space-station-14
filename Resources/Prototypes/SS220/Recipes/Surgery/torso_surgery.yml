        description: surgery-requirement-direct-compact-defib-required
        failureMessage: surgery-requirement-direct-compact-defib-failure
        whitelist:
          components:
          - DirectCompactDefibrillator
    # repair heart
    - to: open-heart-incision
      id: repair-heart
      delay: 9
      failureChance: 0.12
      edgeTooltip: to-repair-heart
      sound: /Audio/SS220/Surgery/organ.ogg
      edgeIcon:
        sprite: Objects/Specific/Medical/Surgery/scissors.rsi
        state: hemostat
      visibilityRequirements:
      - !type:HavePathologyRequirement
        subject: target
        pathology: HeartDamage
        minLevel: 1
        description: surgery-pathology-requirement-description-heart-failure
        failureMessage: surgery-pathology-requirement-failure-heart-failure
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: hemostat
        requirementPriority: -1
        description: surgery-requirement-tool-required-hemostat
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        regressLevel: true
        regressStackCount: 2
        description: surgery-pathology-requirement-description-heart-failure
        failureMessage: surgery-pathology-requirement-failure-heart-failure
        curePathologies:
        - HeartDamage
    # return
    # TOOD: better back
