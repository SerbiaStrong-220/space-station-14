- type: surgeryGraph
  id: TorsoSurgery
  name: surgery-torso-complex-name
  description: surgery-torso-complex-description
  targetPart: Torso
  requirements:
  - !type:EmptyInventorySlotRequirement
    subject: target
    description: surgery-torso-complex-inventory-requirement-description
    failureMessage: surgery-torso-complex-inventory-requirement-failure
    slotNames:
    - jumpsuit
    - outerClothing
  - !type:LyingPatientRequirement
    subject: target
    description: surgery-strap-bed-requirement-description
    failureMessage: surgery-strap-bed-requirement-failure
    strapWhitelist:
      tags:
      - Bed
      components:
      - StasisBed
      requireAll: false
  start: start-torso-surgery
  end: seal-wound
  graph:
  - node: start-torso-surgery
    nodeText:
      examineDescription: surgery-torso-examine-start
      popup: surgery-torso-popup-start
    edges:
    - to: torso-skin-incision
      id: torso-skin-incision
      baseEdge: incision
      edgeTooltip: to-torso-skin-incision

  - node: torso-skin-incision
    baseNode: incision
    edges:
    - to: torso-skin-clamp-bleeders
      id: torso-skin-clamp-bleeders
      baseEdge: clamp-bleeders
      edgeTooltip: to-torso-skin-clamp-bleeders

  - node: torso-skin-clamp-bleeders
    baseNode: clamp-bleeders
    edges:
    - to: retract-torso-skin
      id: retract-torso-skin
      baseEdge: retract-skin
      edgeTooltip: to-retract-torso-skin

  - node: retract-torso-skin
    baseNode: retract-skin
    edges:
    # heal wounds
    - to: retract-torso-skin
      id: retract-torso-skin-heal-wounds
      deceaseSkillBonus: true
      baseEdge: retract-skin
      edgeTooltip: to-torso-internal-healing
      actions:
      - !type:ApplyDamageAction
        damageGrouped:
          Brute: -30
          Burn: -30
        skillTree: Anatomy
        damageBonuses:
          AnatomyInitial: 0.7
          AnatomyBase: 1
          AnatomyTrained: 1.2
          AnatomyProfessional: 1.5
      requirements:
      - !type:TotalDamageRequirement
        subject: target
        damage: 200
        skillTree: Anatomy
        damageMultipliers:
          AnatomyInitial: 1.5
          AnatomyBase: 1
          AnatomyTrained: 0.9
          AnatomyProfessional: 0.75
        description: surgery-requirement-total-damage-requirement-body-heal-description
        failureMessage: surgery-requirement-total-damage-requirement-body-heal-not-enough-damage
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: retractor
        requirementPriority: -1
        description: surgery-requirement-tool-required-retractor
        failureMessage: surgery-requirement-tool-miss
      - !type:HaveReagentInHandRequirement
        subject: performer
        reagentId: Tricordrazine
        consumedAmount: 5
        description: surgery-requirement-reagent-in-hand-description
        failureMessage: surgery-requirement-reagent-in-hand-failure-message
    # remove bullet fragments
    - to: retract-torso-skin
      id: retract-torso-skin-remove-fragments
      delay: 4
      edgeTooltip: remove-torso-bullet-fragments
      edgeIcon:
        sprite: Objects/Specific/Medical/Surgery/scissors.rsi
        state: retractor
      sound:
        path: /Audio/SS220/Surgery/organ.ogg
        params:
          variation: 0.125
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: retractor
        requirementPriority: -1
        description: surgery-requirement-tool-required-retractor
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-torso-fragments
        failureMessage: surgery-pathology-requirement-failure-torso-fragments
        curePathologies:
        - TorsoProjectileFragment
    # hairline fracture
    - to: retract-torso-skin
      id: retract-torso-skin-hairline
      baseEdge: to-repair-hairline-fracture
      edgeTooltip: to-repair-hairline-fracture
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: BoneGel
        requirementPriority: -1
        description: surgery-requirement-tool-required-bone-gel
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-hairline
        failureMessage: surgery-pathology-requirement-failure-hairline
        curePathologies:
        - TorsoHairlineFracture
    # compound fracture
    - to: torso-compound-reset
      id: torso-compound-reset
      baseEdge: to-reset-compound-fracture
      edgeTooltip: to-reset-compound-fracture
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: Bonesetter
        requirementPriority: -1
        description: surgery-requirement-tool-required-bonesetter
        failureMessage: surgery-requirement-tool-miss
      - !type:HavePathologyRequirement
        subject: target
        pathology: TorsoCompoundFracture
        description: surgery-pathology-requirement-description-compound
        failureMessage: surgery-pathology-requirement-failure-compound
    # arterial puncture
    - to: torso-arterial-clamped
      id: torso-arterial-clamp
      baseEdge: to-clamp-arterial-puncture
      edgeTooltip: to-clamp-arterial-puncture
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: hemostat
        requirementPriority: -1
        description: surgery-requirement-tool-required-hemostat
        failureMessage: surgery-requirement-tool-miss
      - !type:HavePathologyRequirement
        subject: target
        pathology: TorsoArterialPuncture
        description: surgery-pathology-requirement-description-arterial
        failureMessage: surgery-pathology-requirement-failure-arterial
    # burn necrosis
    - to: torso-necrosis-excised
      id: torso-necrosis-excise
      baseEdge: to-excise-burn-necrosis
      edgeTooltip: to-excise-burn-necrosis
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: scalpel
        requirementPriority: -1
        description: surgery-requirement-tool-required-scalpel
        failureMessage: surgery-requirement-tool-miss
      - !type:HavePathologyRequirement
        subject: target
        pathology: TorsoBurnNecrosis
        description: surgery-pathology-requirement-description-necrosis
        failureMessage: surgery-pathology-requirement-failure-necrosis
    # abdominal organs
    - to: torso-abdomen-opened
      id: torso-open-abdomen
      baseEdge: incision
      edgeTooltip: to-torso-open-abdomen
    # deeper
    - to: saw-rib-bone
      id: saw-rib-bone
      baseEdge: saw-bone
      edgeTooltip: to-saw-rib-bone
      visibilityRequirements:
      - !type:WhitelistRequirement
        subject: target
        invert: true
        description: surgery-requirement-has-bones-description
        failureMessage: surgery-requirement-has-bones-failure
        whitelist:
          components:
          - Boneless
    - to: saw-rib-bone
      id: part-torso-jelly
      baseEdge: retract-skin
      edgeTooltip: to-part-torso-jelly
      visibilityRequirements:
      - !type:WhitelistRequirement
        subject: target
        description: surgery-requirement-boneless-description
        failureMessage: surgery-requirement-boneless-failure
        whitelist:
          components:
          - Boneless
    # end surgery
    - to: seal-wound
      id: seal-wound
      baseEdge: seal-wound
      edgeTooltip: to-seal-torso-incision

  - node: torso-abdomen-opened
    nodeText:
      examineDescription: torso-abdomen-opened-examine
      popup: torso-abdomen-opened-popup
    edges:
    # liver
    - to: torso-abdomen-opened
      id: extract-liver
      baseEdge: extract-organ
      edgeTooltip: to-extract-liver
      edgeIcon:
        sprite: Mobs/Species/Human/organs.rsi
        state: liver
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: Liver
        organName: surgery-organ-name-liver
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      actions:
      - !type:ExtractOrganAction
        category: Liver
    - to: torso-abdomen-opened
      id: insert-liver
      baseEdge: insert-organ
      edgeTooltip: to-insert-liver
      edgeIcon:
        sprite: Mobs/Species/Human/organs.rsi
        state: liver
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: used
        category: Liver
        organName: surgery-organ-name-liver
        description: surgery-requirement-hold-organ-description
        failureMessage: surgery-requirement-hold-organ-failure
      requirements:
      - !type:HasOrganRequirement
        subject: target
        invert: true
        category: Liver
        organName: surgery-organ-name-liver
        description: surgery-requirement-no-organ-description
        failureMessage: surgery-requirement-no-organ-failure
      - !type:CompatibleOrganRequirement
        subject: target
        description: surgery-requirement-compatible-organ-description
        failureMessage: surgery-requirement-compatible-organ-failure
      actions:
      - !type:InsertOrganAction
        category: Liver
    # stomach
    - to: torso-abdomen-opened
      id: extract-stomach
      baseEdge: extract-organ
      edgeTooltip: to-extract-stomach
      edgeIcon:
        sprite: Mobs/Species/Human/organs.rsi
        state: stomach
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: Stomach
        organName: surgery-organ-name-stomach
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      actions:
      - !type:ExtractOrganAction
        category: Stomach
    - to: torso-abdomen-opened
      id: insert-stomach
      baseEdge: insert-organ
      edgeTooltip: to-insert-stomach
      edgeIcon:
        sprite: Mobs/Species/Human/organs.rsi
        state: stomach
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: used
        category: Stomach
        organName: surgery-organ-name-stomach
        description: surgery-requirement-hold-organ-description
        failureMessage: surgery-requirement-hold-organ-failure
      requirements:
      - !type:HasOrganRequirement
        subject: target
        invert: true
        category: Stomach
        organName: surgery-organ-name-stomach
        description: surgery-requirement-no-organ-description
        failureMessage: surgery-requirement-no-organ-failure
      - !type:CompatibleOrganRequirement
        subject: target
        description: surgery-requirement-compatible-organ-description
        failureMessage: surgery-requirement-compatible-organ-failure
      actions:
      - !type:InsertOrganAction
        category: Stomach
    # kidneys
    - to: torso-abdomen-opened
      id: extract-kidneys
      baseEdge: extract-organ
      edgeTooltip: to-extract-kidneys
      edgeIcon:
        sprite: Mobs/Species/Human/organs.rsi
        state: kidney-l
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: Kidneys
        organName: surgery-organ-name-kidneys
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      actions:
      - !type:ExtractOrganAction
        category: Kidneys
    - to: torso-abdomen-opened
      id: insert-kidneys
      baseEdge: insert-organ
      edgeTooltip: to-insert-kidneys
      edgeIcon:
        sprite: Mobs/Species/Human/organs.rsi
        state: kidney-l
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: used
        category: Kidneys
        organName: surgery-organ-name-kidneys
        description: surgery-requirement-hold-organ-description
        failureMessage: surgery-requirement-hold-organ-failure
      requirements:
      - !type:HasOrganRequirement
        subject: target
        invert: true
        category: Kidneys
        organName: surgery-organ-name-kidneys
        description: surgery-requirement-no-organ-description
        failureMessage: surgery-requirement-no-organ-failure
      - !type:CompatibleOrganRequirement
        subject: target
        description: surgery-requirement-compatible-organ-description
        failureMessage: surgery-requirement-compatible-organ-failure
      actions:
      - !type:InsertOrganAction
        category: Kidneys
    # appendix, extraction only
    - to: torso-abdomen-opened
      id: extract-appendix
      baseEdge: extract-organ
      edgeTooltip: to-extract-appendix
      edgeIcon:
        sprite: Mobs/Species/Human/organs.rsi
        state: appendix
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: Appendix
        organName: surgery-organ-name-appendix
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      actions:
      - !type:ExtractOrganAction
        category: Appendix
    # repair liver
    - to: torso-abdomen-opened
      id: repair-liver
      delay: 6
      failureChance: 0.1
      edgeTooltip: to-repair-liver
      sound: /Audio/SS220/Surgery/organ.ogg
      edgeIcon:
        sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
        state: scalpel
      visibilityRequirements:
      - !type:HavePathologyRequirement
        subject: target
        pathology: LiverDamage
        minLevel: 1
        description: surgery-pathology-requirement-description-liver-failure
        failureMessage: surgery-pathology-requirement-failure-liver-failure
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: scalpel
        requirementPriority: -1
        description: surgery-requirement-tool-required-scalpel
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        regressLevel: true
        regressStackCount: 2
        description: surgery-pathology-requirement-description-liver-failure
        failureMessage: surgery-pathology-requirement-failure-liver-failure
        curePathologies:
        - LiverDamage
    # repair stomach
    - to: torso-abdomen-opened
      id: repair-stomach
      delay: 6
      failureChance: 0.1
      edgeTooltip: to-repair-stomach
      sound: /Audio/SS220/Surgery/organ.ogg
      edgeIcon:
        sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
        state: scalpel
      visibilityRequirements:
      - !type:HavePathologyRequirement
        subject: target
        pathology: StomachDamage
        minLevel: 1
        description: surgery-pathology-requirement-description-stomach-failure
        failureMessage: surgery-pathology-requirement-failure-stomach-failure
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: scalpel
        requirementPriority: -1
        description: surgery-requirement-tool-required-scalpel
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        regressLevel: true
        regressStackCount: 2
        description: surgery-pathology-requirement-description-stomach-failure
        failureMessage: surgery-pathology-requirement-failure-stomach-failure
        curePathologies:
        - StomachDamage
    # return
    - to: retract-torso-skin
      id: torso-close-abdomen
      baseEdge: seal-wound
      edgeTooltip: to-torso-close-abdomen

  - node: torso-compound-reset
    baseNode: compound-fracture-reset
    edges:
    - to: retract-torso-skin
      id: torso-compound-repair
      baseEdge: to-repair-compound-fracture
      edgeTooltip: to-repair-compound-fracture
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: BoneGel
        requirementPriority: -1
        description: surgery-requirement-tool-required-bone-gel
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-compound
        failureMessage: surgery-pathology-requirement-failure-compound
        curePathologies:
        - TorsoCompoundFracture

  - node: torso-arterial-clamped
    baseNode: arterial-puncture-clamped
    edges:
    - to: retract-torso-skin
      id: torso-arterial-seal
      baseEdge: to-seal-arterial-puncture
      edgeTooltip: to-seal-arterial-puncture
      actions:
      - !type:ApplyBleedingAction
        bleedAmount: -10
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: cautery
        requirementPriority: -1
        description: surgery-requirement-tool-required-cautery
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-arterial
        failureMessage: surgery-pathology-requirement-failure-arterial
        curePathologies:
        - TorsoArterialPuncture

  - node: torso-necrosis-excised
    baseNode: burn-necrosis-excised
    edges:
    - to: retract-torso-skin
      id: torso-necrosis-remove
      baseEdge: to-remove-burn-necrosis
      edgeTooltip: to-remove-burn-necrosis
