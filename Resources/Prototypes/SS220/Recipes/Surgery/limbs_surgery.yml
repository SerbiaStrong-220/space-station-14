- type: surgeryGraph
  id: LeftArmSurgery
  name: surgery-leftarm-complex-name
  description: surgery-limb-complex-description
  targetPart: LeftArm
  requirements:
  - !type:EmptyInventorySlotRequirement
    subject: target
    description: surgery-limb-complex-inventory-requirement-description
    failureMessage: surgery-limb-complex-inventory-requirement-failure
    slotNames:
    - jumpsuit
    - outerClothing
  - !type:LyingPatientRequirement
    subject: target
    description: surgery-strap-bed-requirement-description
    failureMessage: surgery-strap-bed-requirement-failure
    strapWhitelist:
      tags:
      - Bed
      components:
      - StasisBed
      requireAll: false
  start: start-leftarm-surgery
  end: seal-wound
  graph:
  - node: start-leftarm-surgery
    nodeText:
      examineDescription: surgery-limb-examine-start
    edges:
    - to: start-leftarm-surgery
      id: start-leftarm-dislocation
      baseEdge: to-repair-dislocation
      edgeTooltip: to-repair-dislocation
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: Bonesetter
        requirementPriority: -1
        description: surgery-requirement-tool-required-bonesetter
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-dislocation
        failureMessage: surgery-pathology-requirement-failure-dislocation
        curePathologies:
        - LeftArmDislocation
    - to: leftarm-skin-incision
      id: leftarm-skin-incision
      baseEdge: incision
      edgeTooltip: to-limb-skin-incision
    - to: leftarm-amputated
      id: leftarm-amputate-shears
      baseEdge: amputate-limb-shears
      edgeTooltip: to-amputate-limb-shears
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: ArmLeft
        organName: surgery-organ-name-arm-left
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      actions:
      - !type:ExtractOrganAction
        category: ArmLeft
      - !type:ApplyBleedingAction
        bleedAmount: 4

  - node: leftarm-skin-incision
    baseNode: incision
    edges:
    - to: leftarm-skin-clamp-bleeders
      id: leftarm-skin-clamp-bleeders
      baseEdge: clamp-bleeders
      edgeTooltip: to-limb-skin-clamp-bleeders

  - node: leftarm-skin-clamp-bleeders
    baseNode: clamp-bleeders
    edges:
    - to: retract-leftarm-skin
      id: retract-leftarm-skin
      baseEdge: retract-skin
      edgeTooltip: to-retract-limb-skin

  - node: retract-leftarm-skin
    baseNode: retract-skin
    edges:
    - to: retract-leftarm-skin
      id: retract-leftarm-dislocation
      baseEdge: to-repair-dislocation
      edgeTooltip: to-repair-dislocation
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: Bonesetter
        requirementPriority: -1
        description: surgery-requirement-tool-required-bonesetter
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-dislocation
        failureMessage: surgery-pathology-requirement-failure-dislocation
        curePathologies:
        - LeftArmDislocation
    - to: retract-leftarm-skin
      id: retract-leftarm-fragments
      delay: 4
      edgeTooltip: remove-limb-bullet-fragments
      edgeIcon:
        sprite: Objects/Specific/Medical/Surgery/scissors.rsi
        state: retractor
      sound:
        path: /Audio/SS220/Surgery/organ.ogg
        params:
          variation: 0.125
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: retractor
        requirementPriority: -1
        description: surgery-requirement-tool-required-retractor
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-limb-fragments
        failureMessage: surgery-pathology-requirement-failure-limb-fragments
        curePathologies:
        - LeftArmProjectileFragment
    - to: retract-leftarm-skin
      id: retract-leftarm-hairline
      baseEdge: to-repair-hairline-fracture
      edgeTooltip: to-repair-hairline-fracture
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: BoneGel
        requirementPriority: -1
        description: surgery-requirement-tool-required-bone-gel
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-hairline
        failureMessage: surgery-pathology-requirement-failure-hairline
        curePathologies:
        - LeftArmHairlineFracture
    - to: leftarm-compound-reset
      id: leftarm-compound-reset
      baseEdge: to-reset-compound-fracture
      edgeTooltip: to-reset-compound-fracture
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: Bonesetter
        requirementPriority: -1
        description: surgery-requirement-tool-required-bonesetter
        failureMessage: surgery-requirement-tool-miss
      - !type:HavePathologyRequirement
        subject: target
        pathology: LeftArmCompoundFracture
        description: surgery-pathology-requirement-description-compound
        failureMessage: surgery-pathology-requirement-failure-compound
    - to: leftarm-arterial-clamped
      id: leftarm-arterial-clamp
      baseEdge: to-clamp-arterial-puncture
      edgeTooltip: to-clamp-arterial-puncture
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: hemostat
        requirementPriority: -1
        description: surgery-requirement-tool-required-hemostat
        failureMessage: surgery-requirement-tool-miss
      - !type:HavePathologyRequirement
        subject: target
        pathology: LeftArmArterialPuncture
        description: surgery-pathology-requirement-description-arterial
        failureMessage: surgery-pathology-requirement-failure-arterial
    - to: leftarm-necrosis-excised
      id: leftarm-necrosis-excise
      baseEdge: to-excise-burn-necrosis
      edgeTooltip: to-excise-burn-necrosis
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: scalpel
        requirementPriority: -1
        description: surgery-requirement-tool-required-scalpel
        failureMessage: surgery-requirement-tool-miss
      - !type:HavePathologyRequirement
        subject: target
        pathology: LeftArmBurnNecrosis
        description: surgery-pathology-requirement-description-necrosis
        failureMessage: surgery-pathology-requirement-failure-necrosis
    - to: leftarm-amputated
      id: leftarm-amputate
      baseEdge: amputate-limb
      edgeTooltip: to-amputate-limb
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: ArmLeft
        organName: surgery-organ-name-arm-left
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      actions:
      - !type:ExtractOrganAction
        category: ArmLeft
    - to: leftarm-attached
      id: leftarm-attach
      baseEdge: attach-limb
      edgeTooltip: to-attach-limb
      edgeIcon:
        sprite: Mobs/Species/Human/parts.rsi
        state: l_arm
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: used
        category: ArmLeft
        organName: surgery-organ-name-arm-left
        description: surgery-requirement-hold-organ-description
        failureMessage: surgery-requirement-hold-organ-failure
      requirements:
      - !type:HasOrganRequirement
        subject: target
        invert: true
        category: ArmLeft
        organName: surgery-organ-name-arm-left
        description: surgery-requirement-no-organ-description
        failureMessage: surgery-requirement-no-organ-failure
      - !type:CompatibleOrganRequirement
        subject: target
        description: surgery-requirement-compatible-organ-description
        failureMessage: surgery-requirement-compatible-organ-failure
      actions:
      - !type:InsertOrganAction
        category: ArmLeft
        rejectionDamage:
          types:
            Poison: 30
    - to: seal-wound
      id: seal-wound
      baseEdge: seal-wound
      edgeTooltip: to-seal-limb-incision

  - node: leftarm-compound-reset
    baseNode: compound-fracture-reset
    edges:
    - to: retract-leftarm-skin
      id: leftarm-compound-repair
      baseEdge: to-repair-compound-fracture
      edgeTooltip: to-repair-compound-fracture
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: BoneGel
        requirementPriority: -1
        description: surgery-requirement-tool-required-bone-gel
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-compound
        failureMessage: surgery-pathology-requirement-failure-compound
        curePathologies:
        - LeftArmCompoundFracture

  - node: leftarm-arterial-clamped
    baseNode: arterial-puncture-clamped
    edges:
    - to: retract-leftarm-skin
      id: leftarm-arterial-seal
      baseEdge: to-seal-arterial-puncture
      edgeTooltip: to-seal-arterial-puncture
      actions:
      - !type:ApplyBleedingAction
        bleedAmount: -10
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: cautery
        requirementPriority: -1
        description: surgery-requirement-tool-required-cautery
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-arterial
        failureMessage: surgery-pathology-requirement-failure-arterial
        curePathologies:
        - LeftArmArterialPuncture

  - node: leftarm-necrosis-excised
    baseNode: burn-necrosis-excised
    edges:
    - to: retract-leftarm-skin
      id: leftarm-necrosis-remove
      baseEdge: to-remove-burn-necrosis
      edgeTooltip: to-remove-burn-necrosis
      actions:
      - !type:ApplyDamageAction
        damageGrouped:
          Burn: -20
          Toxin: -15
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: hemostat
        requirementPriority: -1
        description: surgery-requirement-tool-required-hemostat
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-necrosis
        failureMessage: surgery-pathology-requirement-failure-necrosis
        curePathologies:
        - LeftArmBurnNecrosis

  - node: leftarm-amputated
    baseNode: limb-amputated
    edges:
    - to: leftarm-attached
      id: leftarm-amputated-attach
      baseEdge: attach-limb
      edgeTooltip: to-attach-limb
      edgeIcon:
        sprite: Mobs/Species/Human/parts.rsi
        state: l_arm
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: used
        category: ArmLeft
        organName: surgery-organ-name-arm-left
        description: surgery-requirement-hold-organ-description
        failureMessage: surgery-requirement-hold-organ-failure
      requirements:
      - !type:HasOrganRequirement
        subject: target
        invert: true
        category: ArmLeft
        organName: surgery-organ-name-arm-left
        description: surgery-requirement-no-organ-description
        failureMessage: surgery-requirement-no-organ-failure
      - !type:CompatibleOrganRequirement
        subject: target
        description: surgery-requirement-compatible-organ-description
        failureMessage: surgery-requirement-compatible-organ-failure
      actions:
      - !type:InsertOrganAction
        category: ArmLeft
        rejectionDamage:
          types:
            Poison: 30
    - to: seal-wound
      id: seal-wound
      baseEdge: seal-wound
      edgeTooltip: to-seal-limb-incision

  - node: leftarm-attached
    baseNode: limb-attached
    edges:
    - to: seal-wound
      id: seal-wound
      baseEdge: seal-wound
      edgeTooltip: to-seal-limb-incision

  - node: seal-wound
    baseNode: seal-wound

