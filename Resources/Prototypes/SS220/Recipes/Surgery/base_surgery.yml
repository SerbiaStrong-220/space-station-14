- type: abstractSurgeryEdge
  id: to-tend-brute-wounds
  edge:
    to: abstract
    id: abstract
    delay: 3
    failureChance: 0.05
    edgeTooltip: to-tend-brute-wounds
    sound: /Audio/SS220/Surgery/organ.ogg
    edgeIcon:
      sprite: Objects/Specific/Medical/Surgery/scissors.rsi
      state: hemostat
    requirements:
    - !type:SurgeryToolRequirement
      subject: used
      surgeryTool: hemostat
      requirementPriority: -1
      description: surgery-requirement-tool-required-hemostat
      failureMessage: surgery-requirement-tool-miss
    - !type:TotalDamageRequirement
      subject: target
      damageGroup: Brute
      damage: 5
      description: surgery-requirement-tend-brute-description
      failureMessage: surgery-requirement-tend-brute-failure
    actions:
    - !type:ApplyDamageAction
      damageGrouped:
        Brute: -15
      skillTree: Anatomy
      damageBonuses:
        AnatomyInitial: 0.75
        AnatomyBase: 1
        AnatomyTrained: 1.25
        AnatomyProfessional: 1.5

