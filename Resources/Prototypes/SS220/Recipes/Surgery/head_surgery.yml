- type: surgeryGraph
  id: HeadSurgery
  name: surgery-head-complex-name
  description: surgery-head-complex-description
  targetPart: Head
  requirements:
  - !type:EmptyInventorySlotRequirement
    subject: target
    description: surgery-head-complex-inventory-requirement-description
    failureMessage: surgery-head-complex-inventory-requirement-failure
    slotNames:
    - head
  - !type:LyingPatientRequirement
    subject: target
    description: surgery-strap-bed-requirement-description
    failureMessage: surgery-strap-bed-requirement-failure
    strapWhitelist:
      tags:
      - Bed
      components:
      - StasisBed
      requireAll: false
  start: surgery-head-start
  end: seal-wound
  graph:
  - node: surgery-head-start
    nodeText:
      examineDescription: surgery-head-examine-start
    edges:
    - to: head-skin-incision
      id: head-skin-incision
      baseEdge: incision
      edgeTooltip: to-head-skin-incision
    - to: head-amputated
      id: head-amputate-shears
      baseEdge: amputate-limb-shears
      edgeTooltip: to-amputate-head-shears
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: Head
        organName: surgery-organ-name-head
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      actions:
      - !type:ExtractOrganAction
        category: Head
      - !type:ApplyBleedingAction
        bleedAmount: 4

  - node: head-skin-incision
    baseNode: incision
    edges:
    - to: head-skin-clamp-bleeders
      id: head-skin-clamp-bleeders
      baseEdge: clamp-bleeders
      edgeTooltip: to-head-skin-clamp-bleeders

  - node: head-skin-clamp-bleeders
    baseNode: clamp-bleeders
    edges:
    - to: retract-head-skin
      id: retract-head-skin
      baseEdge: retract-skin
      edgeTooltip: to-retract-head-skin

  - node: retract-head-skin
    baseNode: retract-skin
    edges:
    # implant check
    - to: retract-head-skin
      id: retract-head-skin-implant-check
      delay: 15
      edgeTooltip: to-head-check-implant
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: Head
        organName: surgery-organ-name-head
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      edgeIcon:
        sprite: SS220/Objects/Specific/Medical/surgery_tools.rsi
        state: implant-scanner
      actions:
      - !type:CheckImplantAction
      requirements:
      - !type:WhitelistRequirement
        subject: used
        description: surgery-requirement-scanner-required
        failureMessage: surgery-requirement-scanner-required
        whitelist:
          components:
          - ImplantCheckInSurgery
    # change tts
    - to: retract-head-skin
      id: retract-head-skin-change-tts
      baseEdge: retract-skin
      delay: 15
      edgeTooltip: to-head-change-tts
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: Head
        organName: surgery-organ-name-head
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      actions:
      - !type:ChangeTtsAction
        surgery: HeadSurgery
        node: retract-head-skin
    # cranial fissure repair
    - to: head-cranial-fissure-prepped
      id: head-cranial-fissure-prep
      baseEdge: to-drill-cranial-fissure
      edgeTooltip: to-prep-cranial-fissure
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: Drill
        requirementPriority: -1
        description: surgery-requirement-tool-required-drill
        failureMessage: surgery-requirement-tool-miss
      - !type:HavePathologyRequirement
        subject: target
        pathology: HeadCranialFissure
        description: surgery-pathology-requirement-description-cranial-fissure
        failureMessage: surgery-pathology-requirement-failure-cranial-fissure
    # arterial puncture repair
    - to: head-arterial-clamped
      id: head-arterial-clamp
      baseEdge: to-clamp-arterial-puncture
      edgeTooltip: to-clamp-arterial-puncture
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: hemostat
        requirementPriority: -1
        description: surgery-requirement-tool-required-hemostat
        failureMessage: surgery-requirement-tool-miss
      - !type:HavePathologyRequirement
        subject: target
        pathology: HeadArterialPuncture
        description: surgery-pathology-requirement-description-arterial
        failureMessage: surgery-pathology-requirement-failure-arterial
    # burn necrosis debridement
    - to: head-necrosis-excised
      id: head-necrosis-excise
      baseEdge: to-excise-burn-necrosis
      edgeTooltip: to-excise-burn-necrosis
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: scalpel
        requirementPriority: -1
        description: surgery-requirement-tool-required-scalpel
        failureMessage: surgery-requirement-tool-miss
      - !type:HavePathologyRequirement
        subject: target
        pathology: HeadBurnNecrosis
        description: surgery-pathology-requirement-description-necrosis
        failureMessage: surgery-pathology-requirement-failure-necrosis
    # deeper
    - to: saw-skull-bone
      id: saw-skull-bone
      baseEdge: saw-bone
      edgeTooltip: to-saw-skull-bone
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: Head
        organName: surgery-organ-name-head
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      - !type:WhitelistRequirement
        subject: target
        invert: true
        description: surgery-requirement-has-bones-description
        failureMessage: surgery-requirement-has-bones-failure
        whitelist:
          components:
          - Boneless
    - to: saw-skull-bone
      id: part-head-jelly
      baseEdge: retract-skin
      edgeTooltip: to-part-head-jelly
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: Head
        organName: surgery-organ-name-head
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      - !type:WhitelistRequirement
        subject: target
        description: surgery-requirement-boneless-description
        failureMessage: surgery-requirement-boneless-failure
        whitelist:
          components:
          - Boneless
    - to: head-amputated
      id: head-amputate
      baseEdge: amputate-limb
      edgeTooltip: to-amputate-head
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: Head
        organName: surgery-organ-name-head
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      actions:
      - !type:ExtractOrganAction
        category: Head
    - to: head-attached
      id: head-attach
      baseEdge: attach-limb
      edgeTooltip: to-attach-head
      edgeIcon:
        sprite: Mobs/Species/Human/parts.rsi
        state: head_m
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: used
        category: Head
        organName: surgery-organ-name-head
        description: surgery-requirement-hold-organ-description
        failureMessage: surgery-requirement-hold-organ-failure
      requirements:
      - !type:HasOrganRequirement
        subject: target
        invert: true
        category: Head
        organName: surgery-organ-name-head
        description: surgery-requirement-no-organ-description
        failureMessage: surgery-requirement-no-organ-failure
      - !type:CompatibleOrganRequirement
        subject: target
        description: surgery-requirement-compatible-organ-description
        failureMessage: surgery-requirement-compatible-organ-failure
      actions:
      - !type:InsertOrganAction
        category: Head
        rejectionDamage:
          types:
            Poison: 30
    # return
    - to: seal-wound
      id: seal-wound
      baseEdge: seal-wound
      edgeTooltip: to-seal-head-incision

  - node: head-amputated
    baseNode: limb-amputated
    nodeText:
      examineDescription: head-amputated-examine-description
      popup: head-amputated-popup
    edges:
    - to: head-attached
      id: head-amputated-attach
      baseEdge: attach-limb
      edgeTooltip: to-attach-head
      edgeIcon:
        sprite: Mobs/Species/Human/parts.rsi
        state: head_m
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: used
        category: Head
        organName: surgery-organ-name-head
        description: surgery-requirement-hold-organ-description
        failureMessage: surgery-requirement-hold-organ-failure
      requirements:
      - !type:HasOrganRequirement
        subject: target
        invert: true
        category: Head
        organName: surgery-organ-name-head
        description: surgery-requirement-no-organ-description
        failureMessage: surgery-requirement-no-organ-failure
      - !type:CompatibleOrganRequirement
        subject: target
        description: surgery-requirement-compatible-organ-description
        failureMessage: surgery-requirement-compatible-organ-failure
      actions:
      - !type:InsertOrganAction
        category: Head
        rejectionDamage:
          types:
            Poison: 30
    - to: seal-wound
      id: seal-wound
      baseEdge: seal-wound
      edgeTooltip: to-seal-head-incision

  - node: head-attached
    baseNode: limb-attached
    nodeText:
      examineDescription: head-attached-examine-description
      popup: head-attached-popup
    edges:
    - to: seal-wound
      id: seal-wound
      baseEdge: seal-wound
      edgeTooltip: to-seal-head-incision

  - node: head-cranial-fissure-prepped
    baseNode: cranial-fissure-prepped
    edges:
    - to: retract-head-skin
      id: head-cranial-fissure-repair
      baseEdge: to-repair-hairline-fracture
      edgeTooltip: to-repair-cranial-fissure
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: BoneGel
        requirementPriority: -1
        description: surgery-requirement-tool-required-bone-gel
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-cranial-fissure
        failureMessage: surgery-pathology-requirement-failure-cranial-fissure
        curePathologies:
        - HeadCranialFissure

  - node: head-arterial-clamped
    baseNode: arterial-puncture-clamped
    edges:
    - to: retract-head-skin
      id: head-arterial-seal
      baseEdge: to-seal-arterial-puncture
      edgeTooltip: to-seal-arterial-puncture
      actions:
      - !type:ApplyBleedingAction
        bleedAmount: -10
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: cautery
        requirementPriority: -1
        description: surgery-requirement-tool-required-cautery
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-arterial
        failureMessage: surgery-pathology-requirement-failure-arterial
        curePathologies:
        - HeadArterialPuncture

  - node: head-necrosis-excised
    baseNode: burn-necrosis-excised
    edges:
    - to: retract-head-skin
      id: head-necrosis-remove
      baseEdge: to-remove-burn-necrosis
      edgeTooltip: to-remove-burn-necrosis
      actions:
      - !type:ApplyDamageAction
        damageGrouped:
          Burn: -20
          Toxin: -15
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: hemostat
        requirementPriority: -1
        description: surgery-requirement-tool-required-hemostat
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-necrosis
        failureMessage: surgery-pathology-requirement-failure-necrosis
        curePathologies:
        - HeadBurnNecrosis

  - node: saw-skull-bone-gelled-fixed
    baseNode: saw-bone-gelled-fixed
    edges:
    - to: retract-head-skin
      id: bone-gel
      baseEdge: bone-gel
      edgeTooltip: to-retract-head-skin-after-gel

  - node: saw-skull-bone-gelled
    baseNode: saw-bone-gelled
    edges:
    - to: saw-skull-bone-gelled-fixed
      id: set-bones
      baseEdge: set-bones
      edgeTooltip: to-saw-skull-bone-gelled-fixed

  - node: saw-skull-bone
    baseNode: saw-bone
    nodeText:
      examineDescription: saw-skull-bone-examine
      popup: saw-skull-bone-popup
    edges:
    # remove bullet fragments
    - to: saw-skull-bone
      id: saw-skull-bone-remove-fragments
      delay: 4
      edgeTooltip: remove-head-bullet-fragments
      edgeIcon:
        sprite: Objects/Specific/Medical/Surgery/scissors.rsi
        state: retractor
      sound:
        path: /Audio/SS220/Surgery/organ.ogg
        params:
          variation: 0.125
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: retractor
        requirementPriority: -1
        description: surgery-requirement-tool-required-retractor
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-head-fragments
        failureMessage: surgery-pathology-requirement-failure-head-fragments
        curePathologies:
        - HeadProjectileFragment
    # deeper
    - to: brain-exposed
      id: brain-exposed
      baseEdge: retract-skin
      edgeTooltip: to-open-brain
    # return
    - to: saw-skull-bone-gelled
      id: saw-skull-bone-gelled
      baseEdge: bone-gel
      edgeTooltip: to-saw-skull-bone-gelled
      visibilityRequirements:
      - !type:WhitelistRequirement
        subject: target
        invert: true
        description: surgery-requirement-has-bones-description
        failureMessage: surgery-requirement-has-bones-failure
        whitelist:
          components:
          - Boneless
    - to: retract-head-skin
      id: close-head-jelly
      baseEdge: retract-skin
      edgeTooltip: to-close-head-jelly
      visibilityRequirements:
      - !type:WhitelistRequirement
        subject: target
        description: surgery-requirement-boneless-description
        failureMessage: surgery-requirement-boneless-failure
        whitelist:
          components:
          - Boneless

  - node: brain-exposed
    baseNode: retract-skin
    edges:
    # fix mind slave disfunction
    - to: brain-exposed
      id: brain-exposed-fix-mindslave-disfunction
      delay: 6
      edgeTooltip: to-fix-mindslave-disfunction
      sound:
        path: /Audio/SS220/Surgery/organ.ogg
        params:
          variation: 0.125
      edgeIcon:
        sprite: SS220/Interface/Actions/implants.rsi
        state: mindslave_fixer
      visibilityRequirements:
      - !type:HaveKnowledgeRequirement
        subject: performer
        description: surgery-syndicate-agent-knowledge-requirement-description
        failureMessage: surgery-syndicate-agent-knowledge-requirement-failure
        knowledge: SyndicateAgentKnowledge
      - !type:HasOrganRequirement
        subject: target
        category: Brain
        organName: surgery-organ-name-brain
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      requirements:
      # to give player popup about incorrect tool <- do I need it?
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: specific
        description: surgery-requirement-tool-required-specific
        failureMessage: surgery-requirement-tool-miss
      - !type:WhitelistRequirement
        subject: used
        description: surgery-requirement-fixer-required
        failureMessage: surgery-requirement-fixer-required
        whitelist:
          components:
          - MindSlaveDisfunctionFixer
      - !type:WhitelistRequirement
        subject: target
        description: surgery-requirement-slave-target
        failureMessage: surgery-requirement-slave-target
        whitelist:
          components:
          - MindSlave
      actions:
      - !type:FixMindSlaveDisfunctionAction
    # remove brain damage
    - to: brain-exposed
      id: brain-exposed-heal-brain-damage
      baseEdge: retract-skin
      edgeTooltip: to-brain-exposed-heal-brain-damage
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: Brain
        organName: surgery-organ-name-brain
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      actions:
      - !type:ApplyDamageAction
        damage:
          types:
            Cerebral: -5
        skillTree: Anatomy
        damageBonuses:
          AnatomyInitial: 0.7
          AnatomyBase: 1
          AnatomyTrained: 1.2
          AnatomyProfessional: 1.5
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: retractor
        requirementPriority: -1
        description: surgery-requirement-tool-required-retractor
        failureMessage: surgery-requirement-tool-miss
      - !type:TotalDamageRequirement
        subject: target
        damageType: Cerebral
        damage: 0
        description: surgery-requirement-total-damage-requirement-brain-damage-heal-description
        failureMessage: surgery-requirement-total-damage-requirement-brain-damage-no-damage
    # fix brain-related pathologies
    - to: brain-exposed
      id: brain-exposed-remove-brain-pathology
      delay: 10
      edgeTooltip: remove-brain-pathology
      edgeIcon:
        sprite: Objects/Specific/Medical/Surgery/scissors.rsi
        state: retractor
      sound:
        path: /Audio/SS220/Surgery/organ.ogg
        params:
          variation: 0.125
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: retractor
        description: surgery-requirement-tool-required-retractor
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        description: surgery-pathology-requirement-description-remove-brain-pathology
        failureMessage: surgery-pathology-requirement-failure-remove-brain-pathology
        curePathologies:
        - Slowness
        - PainNumbness
        - PoorVision
        - Muted
        - Narcolepsy
        - Blindness
        - Paracusia
        - LightweightDrunk
        - FrontalLisp
        - Nervousness
    # brain
    - to: brain-exposed
      id: extract-brain
      baseEdge: extract-organ
      delay: 10
      edgeTooltip: to-extract-brain
      edgeIcon:
        sprite: Mobs/Species/Human/organs.rsi
        state: brain
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: Brain
        organName: surgery-organ-name-brain
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      actions:
      - !type:ExtractOrganAction
        category: Brain
    - to: brain-exposed
      id: insert-brain
      baseEdge: insert-organ
      delay: 10
      edgeTooltip: to-insert-brain
      edgeIcon:
        sprite: Mobs/Species/Human/organs.rsi
        state: brain
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: used
        category: Brain
        organName: surgery-organ-name-brain
        description: surgery-requirement-hold-organ-description
        failureMessage: surgery-requirement-hold-organ-failure
      requirements:
      - !type:HasOrganRequirement
        subject: target
        invert: true
        category: Brain
        organName: surgery-organ-name-brain
        description: surgery-requirement-no-organ-description
        failureMessage: surgery-requirement-no-organ-failure
      - !type:CompatibleOrganRequirement
        subject: target
        description: surgery-requirement-compatible-organ-description
        failureMessage: surgery-requirement-compatible-organ-failure
      actions:
      - !type:InsertOrganAction
        category: Brain
    # return
    - to: saw-skull-bone
      id: saw-skull-bone
      baseEdge: seal-wound
      edgeTooltip: to-close-brain-exposure

  - node: seal-wound
    baseNode: seal-wound

# Eyes & Mouth surgeries
- type: surgeryGraph
  id: EyesSurgery
  name: surgery-eyes-complex-name
  description: surgery-eyes-complex-description
  targetPart: Eyes
  requirements:
  - !type:EmptyInventorySlotRequirement
    subject: target
    description: surgery-eyes-complex-inventory-requirement-description
    failureMessage: surgery-eyes-complex-inventory-requirement-failure
    slotNames:
    - eyes
  - !type:EmptyInventorySlotRequirement
    subject: target
    description: surgery-head-complex-inventory-requirement-description
    failureMessage: surgery-head-complex-inventory-requirement-failure
    slotNames:
    - head
  - !type:LyingPatientRequirement
    subject: target
    description: surgery-strap-bed-requirement-description
    failureMessage: surgery-strap-bed-requirement-failure
    strapWhitelist:
      tags:
      - Bed
      components:
      - StasisBed
      requireAll: false
  - !type:HasOrganRequirement
    subject: target
    category: Head
    organName: surgery-organ-name-head
    description: surgery-requirement-has-organ-description
    failureMessage: surgery-requirement-has-organ-failure
  start: start-eyes-surgery
  end: seal-wound
  graph:
  - node: start-eyes-surgery
    nodeText:
      examineDescription: surgery-eyes-examine-start
    edges:
    - to: eyes-retract-lids
      id: eyes-retract-lids
      baseEdge: retract-skin
      edgeTooltip: to-retract-eyelids

  - node: eyes-retract-lids
    baseNode: retract-skin
    edges:
    - to: eyes-cornea-prepped
      id: eyes-cornea-prep
      baseEdge: to-clamp-arterial-puncture
      edgeTooltip: to-prep-eye-cornea
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: hemostat
        requirementPriority: -1
        description: surgery-requirement-tool-required-hemostat
        failureMessage: surgery-requirement-tool-miss
      - !type:HavePathologyRequirement
        subject: target
        pathology: EyeCornealTrauma
        description: surgery-pathology-requirement-description-eye-corneal
        failureMessage: surgery-pathology-requirement-failure-eye-corneal
    # eyes
    - to: eyes-retract-lids
      id: extract-eyes
      baseEdge: extract-organ
      edgeTooltip: to-extract-eyes
      edgeIcon:
        sprite: Mobs/Species/Human/organs.rsi
        state: eyeball-l
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: target
        category: Eyes
        organName: surgery-organ-name-eyes
        description: surgery-requirement-has-organ-description
        failureMessage: surgery-requirement-has-organ-failure
      actions:
      - !type:ExtractOrganAction
        category: Eyes
    - to: eyes-retract-lids
      id: insert-eyes
      baseEdge: insert-organ
      edgeTooltip: to-insert-eyes
      edgeIcon:
        sprite: Mobs/Species/Human/organs.rsi
        state: eyeball-l
      visibilityRequirements:
      - !type:HasOrganRequirement
        subject: used
        category: Eyes
        organName: surgery-organ-name-eyes
        description: surgery-requirement-hold-organ-description
        failureMessage: surgery-requirement-hold-organ-failure
      requirements:
      - !type:HasOrganRequirement
        subject: target
        invert: true
        category: Eyes
        organName: surgery-organ-name-eyes
        description: surgery-requirement-no-organ-description
        failureMessage: surgery-requirement-no-organ-failure
      - !type:CompatibleOrganRequirement
        subject: target
        description: surgery-requirement-compatible-organ-description
        failureMessage: surgery-requirement-compatible-organ-failure
      actions:
      - !type:InsertOrganAction
        category: Eyes
        rejectionDamage:
          types:
            Poison: 15
    # repair eyes
    - to: eyes-retract-lids
      id: repair-eyes
      delay: 6.5
      failureChance: 0.1
      edgeTooltip: to-repair-eyes
      sound: /Audio/SS220/Surgery/organ.ogg
      edgeIcon:
        sprite: Objects/Specific/Medical/Surgery/scissors.rsi
        state: hemostat
      visibilityRequirements:
      - !type:HavePathologyRequirement
        subject: target
        pathology: RetinaDamage
        minLevel: 1
        description: surgery-pathology-requirement-description-eyes-failure
        failureMessage: surgery-pathology-requirement-failure-eyes-failure
      requirements:
      - !type:SurgeryToolRequirement
        subject: used
        surgeryTool: hemostat
        requirementPriority: -1
        description: surgery-requirement-tool-required-hemostat
        failureMessage: surgery-requirement-tool-miss
      - !type:SurgeryPathologyRequirement
        subject: target
        regressLevel: true
        regressStackCount: 2
        description: surgery-pathology-requirement-description-eyes-failure
        failureMessage: surgery-pathology-requirement-failure-eyes-failure
        curePathologies:
        - RetinaDamage
    - to: seal-wound
      id: seal-wound
      baseEdge: seal-wound
      edgeTooltip: to-seal-eyes-surgery

  - node: eyes-cornea-prepped
    nodeText:
      examineDescription: eyes-cornea-prepped-examine-description
      popup: eyes-cornea-prepped-popup
    edges:
    - to: eyes-retract-lids
