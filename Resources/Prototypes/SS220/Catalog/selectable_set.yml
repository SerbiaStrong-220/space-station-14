    sprite: SS220/Objects/Storage/Briefcases/bs_weapon_case_large.rsi
  - type: SetSelector
    spawnedStoragePrototype: BriefcaseWeaponBlueshield
    maxSelectedSets: 1
    possibleSets:
    - WeaponBlasterKRSSet
    - WeaponDrozdSet

- type: entity
