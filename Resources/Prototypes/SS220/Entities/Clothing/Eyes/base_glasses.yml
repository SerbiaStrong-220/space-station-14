# Shared properties for eyewear, independent of forehead sprite support.

- type: entity
  parent: [ClothingEyesBase]
  id: SS220ClothingEyesGlassesMesonBase
  abstract: true
  name: engineering goggles #less confusion
  description: Green-tinted goggles using a proprietary polymer that provides protection from eye damage of all types.
  components:
  - type: Sprite
    sprite: Clothing/Eyes/Glasses/meson.rsi
  - type: Clothing
    sprite: Clothing/Eyes/Glasses/meson.rsi
    clothingVisuals:
      head:
      - sprite: SS220/Clothing/Eyes/Forehead/Glasses/meson.rsi
        state: equipped-HELMET
      head-arachnid:
      - sprite: SS220/Clothing/Eyes/Forehead/Glasses/meson.rsi
        state: equipped-HELMET-arachnid
      head-moth:
      - sprite: SS220/Clothing/Eyes/Forehead/Glasses/meson.rsi
        state: equipped-HELMET-moth

  - type: EyeProtection
  - type: IdentityBlocker
    coverage: EYES
  - type: Tag
    tags:
    - PetWearable
    - WhitelistChameleon
    - SecDogWearable # Roxi

