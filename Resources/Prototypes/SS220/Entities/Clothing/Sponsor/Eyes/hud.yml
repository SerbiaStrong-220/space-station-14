# CyberPunk
- type: entity
  parent: [ClothingSponsorEyesBaseUnshaded, SS220ClothingEyesGlassesSecurityBase, SS220GlassesOnForeheadBase] # SS220-glasses-on-forehead
  id: ClothingSponsorCyberSecVisor
  name: security cybervisor
  description: Despite its menacing appearance, it provides no protection against flashes or paparazzi.
  components:
  - type: Sprite
    sprite: SS220/Clothing/Sponsor/Eyes/Hud/CyberPunk/secvisor.rsi
  - type: Clothing
    slots: [EYES, HEAD] # SS220-glasses-on-forehead
    sprite: SS220/Clothing/Sponsor/Eyes/Hud/CyberPunk/secvisor.rsi
    clothingVisuals:
      eyes:
      - state: equipped-EYES
      - state: equipped-EYES-unshaded
        shader: unshaded
      head:
      - state: equipped-HELMET
      - state: equipped-HELMET-unshaded
        shader: unshaded

