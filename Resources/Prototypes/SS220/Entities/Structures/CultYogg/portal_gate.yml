- type: entity
  id: VoidPortalGate
  parent: BaseStructure
  suffix: CultYogg
  name: Gates from the void
  description: A gate that allows one to escape beyond the Void.
  components:
  - type: Clickable
  - type: PointLight
    radius: 3.0
    energy: 1.5
    color: "#9dc8c8"
  - type: Physics
    bodyType: Static
  - type: CollisionTeleportTrigger
    triggerFixtureId: portal
    deleteTargetWhitelist:
      components:
      - Explosive
      - ProjectileGrenade
  - type: TeleportToRandomPoweredLight
  - type: PolymorphAfterTeleport
    polymorphPrototype: VoidChasmCameraPoly
  - type: Fixtures
    fixtures:
      left:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-0.5,-0.4,0.55"
        density: 1000
        layer:
        - WallLayer
      right:
        shape:
          !type:PhysShapeAabb
          bounds: "0.4,-0.5,0.6,0.55"
        density: 1000
        layer:
        - WallLayer
      top:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,0.55,0.6,0.7"
        density: 1000
        layer:
        - WallLayer
      portal:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.55,-0.4,0.55,0.4"
        layer:
        - WallLayer
        hard: false
  - type: Sprite
    sprite: SS220/Structures/CultYogg/void_portal_gate.rsi
    layers:
    - state: base
    - state: portal
      shader: unshaded
    - state: light
      shader: unshaded
    drawdepth: Overdoors
    offset: "0.0,0.5"
