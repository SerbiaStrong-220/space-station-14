- type: entity
  parent: BaseWallmountCabinet
  id: WeaponStand
  name: weapon stand
  components:
  - type: Lock
  - type: LockVisuals
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 4
  - type: Sprite
    sprite: /Textures/SS220/Structures/Wallmounts/weapon_stand.rsi
    layers:
    - state: weapon-stand
    - state: shotgun
      map: ["enum.ItemCabinetVisuals.Layer"]
      visible: true
    - state: open
      map: ["enum.OpenableVisuals.Layer"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
  - type: ItemSlots
    slots:
      ItemCabinet:
        ejectOnInteract: true
        whitelist:
          tags:
          - WeaponShotgunDoubleBarreled
  - type: AccessReader
    access: [["Security"], ["Bar"]]

- type: entity
  parent: WeaponStand
  id: WeaponStandOpen
  suffix: Open
  components:
  - type: Openable
    opened: true
  - type: Lock
    locked: false

- type: entity
  parent: WeaponStand
  id: WeaponStandFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      ItemCabinet:
      - WeaponShotgunDoubleBarreled

- type: entity
  parent: [WeaponStandFilled, WeaponStandOpen]
  id: WeaponStandFilledOpen
  suffix: Filled, Open
