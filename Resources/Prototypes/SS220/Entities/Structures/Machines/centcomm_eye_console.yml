- type: entity
  parent: BaseComputer
  id: ComputerCentCommObservation
  name: station observation console
  description: A Central Command terminal for watching over a station.
  categories: [ DoNotMap ]
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: cameras
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: AccessReader
    access: [[ "CentralCommand" ]]
  - type: CentCommEyeConsole
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#e0ad5d"
