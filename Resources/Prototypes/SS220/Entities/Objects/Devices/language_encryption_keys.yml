- type: entity
  parent: EncryptionKey
  id: DecryptionKeyTernary
  name: decryption key ternary
  description: A small cryptographic chip. Allows you to understand another language.
  components:
  - type: LanguageEncryptionKey
    languages:
    - Ternary
  - type: Sprite
    sprite: SS220/Objects/Devices/encryption_keys.rsi
    layers:
    - state: decrypt_ipc

