- type: entity
  parent: BaseItem
  id: SupermatterObserverCartridge
  name: Supermatter observer cartridge
  description: A compact program which provides essential info about SM crystal
  components:
    - type: Sprite
      sprite: SS220/Objects/Devices/cartridge.rsi
      state: cart-smobserver
    - type: Icon
      sprite: SS220/Objects/Devices/cartridge.rsi
      state: cart-smobserver
    - type: UIFragment
      ui: !type:SupermatterObserverUi
    - type: Cartridge
      programName: log-supermatter-observer-program-name
      icon:
        sprite: SS220/Structures/Power/Generation/Supermatter/crystal.rsi
        state: icon
    - type: SuperMatterObserverReceiver

- type: entity
  parent: BaseItem
  id: MessengerCartridgeClient
  name: messenger cartridge
  description: A station messenger program
  components:
    - type: Sprite
      sprite: Objects/Devices/cartridge.rsi
      state: cart-y
    - type: Icon
      sprite: Objects/Devices/cartridge.rsi
      state: cart-y
    - type: UIFragment
      ui: !type:MessengerUi
    - type: Cartridge
      programName: messenger-program-name
      icon:
        sprite: SS220/Interface/Actions/actions_ai_ccsa.rsi
        state: pda_send
    - type: MessengerClientCartridge
    - type: StationLimitedNetwork
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: MessengerClient
      transmitFrequencyId: MessengerServer
      prefix: device-address-prefix-msg-client
    - type: WirelessNetworkConnection
      range: 500
