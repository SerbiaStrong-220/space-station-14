- type: entity
  name: compact direct defibrillator
  description: small and low power hand-held defibrillator for direct heart apply only
  parent: BaseItem
  id: DirectHandHeldDefibrillator
  components:
  - type: Sprite
    sprite: SS220/Objects/Specific/Medical/surgery_tools.rsi
    state: direct-defibrillator
  - type: Item
    size: Small
    storedRotation: 90
  - type: DirectCompactDefibrillator
  - type: UseDelay
  - type: Defibrillator
    zapHeal:
      types:
        Asphyxiation: -40
  - type: GuideHelp
    guides:
    - Surgery

- type: entity
  name: implant scanner
  description: Advanced scanner which can find poorly hidden uncommon objects in person body
  parent: BaseItem
  id: HandHeldImplantMedicalScanner
  components:
  - type: Sprite
    sprite: SS220/Objects/Specific/Medical/surgery_tools.rsi
    state: implant-scanner
  - type: Item
    size: Small
    storedRotation: 90
  - type: ImplantCheckInSurgery
  - type: GuideHelp
    guides:
    - Surgery

- type: entity
  name: implant scanner report
  description: Better than get playing russian roulette with implanter
  parent: Paper
  id: ImplantCheckReportPaper
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper_receipt_horizontal
    - state: paper_receipt_horizontal_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_perforated.svg.96dpi.png"
    headerImagePath: "/Textures/Interface/Paper/paper_heading_forensic_scanner.svg.96dpi.png"
    headerMargin: 0.0, 0.0, 0.0, 4.0
    backgroundImageTile: true
    backgroundPatchMargin: 6.0, 0.0, 6.0, 0.0
    contentMargin: 12.0, 0.0, 6.0, 0.0
    maxWritableArea: 368.0, 256.0

- type: entity
  parent: BaseItem
  id: MindslaveFixerCerebralImplant
  name : cerebral implant
  description: weird implant, why it even exists...
  components:
  - type: Sprite
    sprite: SS220/Interface/Actions/implants.rsi
    state: mindslave_fixer
  - type: MindSlaveDisfunctionFixer
  - type: SurgeryTool
    toolType: Specific
    failureDamage:
      types:
        Cerebral: 5
  - type: HiddenDescription
    entries:
      MedicalKnowledge: [ hidden-desc-implant-manipulator-medical ]
      SyndicateAgentKnowledge: [ hidden-desc-implant-mindslave-fixer-manipulator-syndicate ]
      ScienceKnowledge: [ hidden-desc-implant-manipulator-research ]
    nameEntries:
    - [MedicalKnowledge, null]
    - [SyndicateAgentKnowledge, null]
    - [ScienceKnowledge, null]
    hiddenName: ent-MindslaveFixerCerebralImplant
  - type: GuideHelp
    guides:
    - Surgery

- type: entity
  name: bone setter
  id: BoneSetter
  parent: Retractor
  description: A surgical tool used for setting bones.
  components:
  - type: Sprite
    sprite: SS220/Objects/Specific/Medical/surgery_tools.rsi
    state: bonesetter
  - type: Item
    heldPrefix: setter
    storedRotation: 90
  - type: Tag
    tags:
    - SurgeryTool
    - SurgeryBoneSetter
  - type: SurgeryTool
    failureDamage:
      types:
        Blunt: 8
    toolType: Bonesetter
    sound:
      path: /Audio/SS220/Surgery/retractor.ogg
      params:
        variation: 0.125

- type: entity
  parent: Retractor
  id: RetractorAdvanced
  name: mechanical pinches
  description: An agglomerate of gears and levers that combines a retractor, hemostat, and bonesetter.
  components:
  - type: Sprite
    sprite: SS220/Objects/Specific/Medical/surgery_tools.rsi
    state: adv_retractor
  - type: Item
    storedRotation: 90
  - type: Tag
    tags:
    - SurgeryTool
    - SurgeryRetractorAdvanced
  - type: SurgeryTool
    toolType: Retractor
    additionalToolTypes:
    - Hemostat
    - Bonesetter
    speedModifier: 0.7
    failureModifier: -0.05
    failureDamage:
      types:
        Slash: 4
    sound:
      path: /Audio/SS220/Surgery/retractor.ogg
      params:
        variation: 0.125

- type: entity
  parent: Cautery
  id: CauteryAdvanced
  name: searing tool
  description: A high-powered laser unit used for instant cauterization and precision bone drilling.
  components:
  - type: Sprite
    sprite: SS220/Objects/Specific/Medical/surgery_tools.rsi
    state: e_cautery
  - type: Item
    storedRotation: 90
  - type: Tag
    tags:
    - SurgeryTool
    - SurgeryCauteryAdvanced
  - type: SurgeryTool
    toolType: Cautery
    additionalToolTypes:
    - Drill
    speedModifier: 0.7
    failureModifier: -0.05
    failureDamage:
      types:
        Heat: 4
    sound:
      path: /Audio/SS220/Surgery/cautery.ogg
      params:
        variation: 0.125

- type: entity
  parent: SawElectric
  id: AmputationShears
  name: amputation shears
  description: Heavy-duty surgical shears designed for rapid bone cutting and limb amputation.
  components:
  - type: Sprite
    sprite: SS220/Objects/Specific/Medical/surgery_tools.rsi
    state: shears
  - type: Item
    size: Normal
  - type: SurgeryTool
    toolType: Shears
    additionalToolTypes:
    - Saw
    speedModifier: 0.6
    failureModifier: -0.05
    failureDamage:
      types:
        Slash: 15
    sound:
      path: /Audio/SS220/Surgery/saw.ogg
      params:
        variation: 0.125

- type: entity
  parent: BaseToolSurgery
  id: BloodFilter
  name: blood filter
  description: A compact surgical pump used for filtering toxins and reagents from a patient's bloodstream during open-chest surgery.
  components:
  - type: Sprite
    sprite: SS220/Objects/Specific/Medical/surgery_tools.rsi
    state: bloodfilter
  - type: Item
    size: Small
  - type: Tag
    tags:
    - SurgeryTool
    - SurgeryBloodFilter
  - type: SurgeryTool
    toolType: BloodFilter
    failureDamage:
      types:
        Piercing: 5
    sound:
      path: /Audio/SS220/Surgery/organ.ogg
      params:
        variation: 0.125

- type: entity
  parent: BaseToolSurgery
  id: AutopsyScanner
  name: autopsy scanner
  description: A forensic medical scanner used to inspect internal tissue trauma and cause of death.
  components:
  - type: Sprite
    sprite: Objects/Tools/handheld_mass_scanner.rsi
    state: icon
  - type: Item
    size: Small
  - type: SurgeryTool
    toolType: AutopsyScanner
    failureModifier: 0
    isPainless: true
    sound:
      path: /Audio/Items/hypospray.ogg

- type: entity
  parent: BaseStorageItem
  id: SurgeryTray
  name: surgical tray
  description: A sterile stainless steel tray for organizing surgical instruments.
  components:
  - type: Sprite
    sprite: SS220/Objects/Specific/Medical/medicart.rsi
    state: tray
    scale: 0.8, 0.8
  - type: Item
    size: Large
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,5,4
    whitelist:
      components:
      - SurgeryTool
      - SurgeryStarter
      - BodyAnalyzer
      - Injector
      - Healing
  - type: ItemMapper
    sprite: SS220/Objects/Specific/Medical/medicart.rsi
    mapLayers:
      drapes:
        whitelist:
          tags:
          - SurgeryDrapes
      scalpel_normal:
        whitelist:
          tags:
          - SurgeryScalpelNormal
      scalpel_advanced:
        whitelist:
          tags:
          - SurgeryScalpelAdvanced
      retractor_normal:
        whitelist:
          tags:
          - SurgeryRetractor
      retractor_advanced:
        whitelist:
          tags:
          - SurgeryRetractorAdvanced
      hemostat_normal:
        whitelist:
          tags:
          - SurgeryHemostat
      cautery_normal:
        whitelist:
          tags:
          - SurgeryCautery
      cautery_advanced:
        whitelist:
          tags:
          - SurgeryCauteryAdvanced
      saw_normal:
        whitelist:
          tags:
          - SurgerySaw
      drill_normal:
        whitelist:
          tags:
          - SurgeryDrill
      bonesetter:
        whitelist:
          tags:
          - SurgeryBoneSetter
      gel:
        whitelist:
          tags:
          - SurgeryBoneGel
      filter:
        whitelist:
          tags:
          - SurgeryBloodFilter
  - type: Appearance
  - type: GuideHelp
    guides:
    - Surgery

- type: entity
  parent: SurgeryTray
  id: SurgeryTrayFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: SurgeryDrapes
    - id: Scalpel
    - id: Retractor
    - id: Hemostat
    - id: Cautery
    - id: SawElectric
    - id: BoneGel
    - id: BoneSetter
    - id: Drill
    - id: BodyAnalyzer

