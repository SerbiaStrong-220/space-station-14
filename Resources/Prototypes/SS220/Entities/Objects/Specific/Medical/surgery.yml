- type: entity
  parent: BaseToolSurgery
  id: SurgeryDrapes
  name: surgery drapes
  description: drapes which used in surgery
  components:
  - type: Sprite
    sprite: SS220/Objects/Specific/Medical/surgery_tools.rsi
    state: drape
  - type: StaticPrice
    price: 20
  - type: Tag
    tags:
    - SurgeryTool
    - SurgeryDrapes
  - type: SurgeryStarter
  - type: ActivatableUI
    key: enum.SurgeryDrapeUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SurgeryDrapeUiKey.Key:
        type: SurgeryDrapeBUI
  - type: GuideHelp
    guides:
    - Surgery


- type: entity
  parent: BaseToolSurgery
  id: BoneGel
  name: bone gel
  description: A specialized bioactive gel used in surgery to rapidly fuse and repair bone tissue.
  components:
  - type: Sprite
    sprite: SS220/Objects/Specific/Medical/surgery_tools.rsi
    state: bone-gel
  - type: StaticPrice
    price: 20
  - type: SurgeryTool
    toolType: BoneGel
  - type: Tag
    tags:
    - SurgeryTool
    - SurgeryBoneGel

- type: entity
  parent: BaseToolSurgery
  id: BodyAnalyzer
