- type: entity
  id: SynthPartBase
  parent: BaseItem
  name: base synth mod
  abstract: true
  components:
  - type: SiliconPart
  - type: Item

- type: entity
  id: SynthOpticsBase
  parent: SynthPartBase
  abstract: true
  name: base synth optics
  components:
  - type: Damageable
    damageContainer: Synthetic
    damageModifierSet: Synthetic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 40
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
  - type: SiliconPart
    partType: Optics
  - type: ActiveOptics
  - type: Item

- type: entity
  id: SynthBrainBase
  parent: SynthPartBase
  abstract: true
  name: base synth brain
  components:
  - type: BlockMovement
  - type: Examiner
  - type: NameIdentifier
    group: PositronicBrain
  - type: DoAfter
  - type: Actions
  - type: Speech
    speechSounds: Pai
  - type: Alerts
  - type: Appearance
  - type: Tag
    tags:
    - CannotSuicide
  - type: ChangeVoiceInContainer
    whitelist:
      components:
      - SecretStash
  - type: MindExaminable
  - type: AntagGearRelay
  - type: AntagSelection
  - type: SiliconPart
    partType: Brain
  - type: Brain
  - type: Item
    storedRotation: -90

- type: entity
  id: SynthServoBase
  parent: SynthPartBase
  #abstract: true
  name: base synth servo
  components:
  - type: Damageable
    damageContainer: Synthetic
    damageModifierSet: Synthetic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 50
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
  - type: Servo
  - type: SiliconPart
    partType: Servo
  - type: Item

- type: entity
  id: SynthDriveBase
  parent: SynthPartBase
  abstract: true
  name: base synth drive
  components:
  - type: Drive
  - type: Damageable
    damageContainer: Synthetic
    damageModifierSet: Synthetic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 40
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
  - type: SiliconPart
    partType: Drive
  - type: Item

- type: entity
  id: SynthSpineBase
  parent: SynthPartBase
  abstract: true
  name: base synth spine
  components:
  - type: SiliconPart
    partType: Spine
  - type: Damageable
    damageContainer: Synthetic
    damageModifierSet: Synthetic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 80
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
  - type: Item
    size: Ginormous


