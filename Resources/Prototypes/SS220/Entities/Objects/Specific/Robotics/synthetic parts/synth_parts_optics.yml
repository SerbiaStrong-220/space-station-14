- type: entity
  id: SynthOpticsDefault
  parent: SynthOpticsBase
  name: synthetic camera module
  description: High-res 120 FPS camera module. Standard issue of the 26-th century
  components:
  - type: DamabeableSiliconPart
    minDamageToMalfunction: 20
    maxDamageToRemainFunctional: 35
  - type: Item
    storedRotation: -90
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#8FCBCB"
      - state: base-module-inhand-left
        color: "#A1A1A1"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#7D7D7D"
      right:
      - state: base-icon-inhand-right
        color: "#8FCBCB"
      - state: base-module-inhand-right
        color: "#A1A1A1"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#7D7D7D"
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: engineering

