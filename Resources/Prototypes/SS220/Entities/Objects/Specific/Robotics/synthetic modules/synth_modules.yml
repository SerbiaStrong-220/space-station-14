- type: entity
  id: SynthModuleBase
  parent: BaseItem
  name: base synth mod
  abstract: true
  components:
  - type: SiliconModule
  - type: Item
    storedRotation: -90
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#8FCBCB"
      - state: base-module-inhand-left
        color: "#A1A1A1"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#7D7D7D"
      right:
      - state: base-icon-inhand-right
        color: "#8FCBCB"
      - state: base-module-inhand-right
        color: "#A1A1A1"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#7D7D7D"
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: engineering

- type: entity
  id: SynthModTest
  parent: SynthModuleBase
  name: base synth mod
  components:
  - type: Item
    storedRotation: -90
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#8FCBCB"
      - state: base-module-inhand-left
        color: "#A1A1A1"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#7D7D7D"
      right:
      - state: base-icon-inhand-right
        color: "#8FCBCB"
      - state: base-module-inhand-right
        color: "#A1A1A1"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#7D7D7D"
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: engineering

- type: entity
  id: SynthModHiddenUplink
  parent: BaseUplinkRadio20TC
  name: portable radio
  description: It looks like it could be easily hidden somewhere..
  components:
  - type: SiliconModule
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: old-radio
  - type: Item
    sprite: Objects/Devices/communication.rsi
    heldPrefix: old-radio
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    balance:
      Telecrystal: 0
  - type: ScaleVisuals
    scale: 0.8, 0.8

- type: entity
  id: SynthModLightIntensifier
  parent: SynthModTest
  name: image intensifier module
  components:
  - type: Item
    storedRotation: -90
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#8FCBCB"
      - state: base-module-inhand-left
        color: "#A1A1A1"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#7D7D7D"
      right:
      - state: base-icon-inhand-right
        color: "#8FCBCB"
      - state: base-module-inhand-right
        color: "#A1A1A1"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#7D7D7D"
  - type: Tag
    tags: [ImageIntensifierModule]
  - type: ComponentAddingSiliconModule
    components:
    - type: ScotopicVision
  - type: SiliconModuleBlacklist
    moduleBlacklist:
      tags: [ImageIntensifierModule]
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: engineering

- type: entity
  id: SynthModIntegratedSMG
  parent: SynthModTest
