        color: "#A1A1A1"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#7D7D7D"
  - type: SiliconModuleArmInstallation
    item: WeaponSubMachineGunWt550
  - type: Tag
