- type: entity
  name: cult shell
  parent: BaseRestrictedLivingItem
  id: BaseLivingItemShell
  suffix: CultYogg
  abstract: true
  components:
  - type: ContainerContainer
    containers:
      item-shell-content: !type:ContainerSlot {}
  - type: ItemShell
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: Sprite
    sprite: SS220/Objects/CultYogg/CorruptedItems/shell.rsi
    layers:
    - state: icon
  - type: Tag
    tags:
    - YoggEquipment
    - CultYoggStealthProvidable

- type: entity
  id: ShellSpikegun
  parent: [BaseLivingItemShell, BaseItem]
  components:
  - type: ItemShell
    itemPrototype: Spikegun
  - type: ContainerFill
    containers:
      item-shell-content:
      - Spikegun

