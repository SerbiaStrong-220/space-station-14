- type: entity
  parent: [BaseItem, CultYoggRestrictedItem]
  id: VoidKey
  name: void key
  description: Opens portals to the VOID
  components:
  - type: Sprite
    sprite: SS220/Objects/CultYogg/CorruptedItems/voidkey.rsi
    state: icon
  - type: Item
    sprite: SS220/Objects/CultYogg/CorruptedItems/voidkey.rsi
    size: Tiny
  - type: UseDelay
    delay: 10
  - type: TriggerOnUse
  - type: SpawnOnTrigger
    proto: VoidPortalSpawn
    useMapCoords: true
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Slash: 15.5
  - type: ThrowingAngle
    angularVelocity: true # spins
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 10
  - type: AltVerbTeleportTrigger
    verbText: void-key-teleport-verb
    userWhitelist:
      components:
      - CultYogg
    userBlacklist:
      components:
      - VoidBlocker
  - type: RandomTeleport
    destinationComponentName: "RandomTeleportDestination"
    destinationWhitelist:
      tags:
      - VoidTeleportDestination
  - type: PolymorphAfterTeleport
    polymorphPrototype: VoidKeyCameraPoly
  - type: DeleteTeleporterOnUse
    deleteSound:
      path: /Audio/Effects/glass_smash.ogg
  - type: SpawnBeforeTeleport
    spawnPrototype: TeleportVanishEffect
  - type: StatusEffectsAfterTeleport
    effects:
      StatusEffectVoidBlocker: 600

- type: entity
  id: VoidPortal
  suffix: CultYogg
  components:
  - type: InteractionOutline
  - type: Clickable
  - type: Sprite
    noRot: true
    drawdepth: Ghosts
    sprite: SS220/Objects/CultYogg/void_portal_enter.rsi
    layers:
    - state: portal_loop
      shader: unshaded
  # spawn animation lasts 2 seconds, we loop
  - type: TimedDespawn
    lifetime: 12
  - type: SpawnOnDespawn
    prototype: VoidPortalClosed
  - type: InteractionTeleportTrigger
    teleportDoAfterTime: 2
    damageThreshold: 7
    targetWhitelist:
      components:
      - CultYogg
      - MiGo
  - type: RandomTeleport
    destinationComponentName: "RandomTeleportDestination"
    destinationWhitelist:
      tags:
      - VoidTeleportDestination
  - type: PolymorphAfterTeleport
    polymorphPrototype: VoidKeyCameraPoly

# Animation entities for better immersion.
- type: entity
  id: VoidPortalSpawn
  suffix: CultYogg
  components:
  - type: Sprite
    noRot: true
    drawdepth: Ghosts
    sprite: SS220/Objects/CultYogg/void_portal_enter.rsi
    layers:
    - state: portal_open
      shader: unshaded
  # spawn animation lasts 1.6 seconds
  - type: TimedDespawn
    lifetime: 1.6
  - type: SpawnOnDespawn
    prototype: VoidPortal

- type: entity
  id: VoidPortalClosed
  suffix: CultYogg
  components:
  - type: Sprite
    noRot: true
    drawdepth: Ghosts
    sprite: SS220/Objects/CultYogg/void_portal_enter.rsi
    layers:
    - state: portal_close
      shader: unshaded
  # The close animation lasts 1.2 seconds, but a 1.1 second lifetime keeps it visually synchronized.
  - type: TimedDespawn
    lifetime: 1.1

- type: entity
  id: TeleportVanishEffect
  suffix: CultYogg
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.85
  - type: Sprite
    drawdepth: Mobs # Above items
    noRot: true
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: SS220/Effects/CultYogg/fast_tp.rsi
      state: fast_tp
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer
