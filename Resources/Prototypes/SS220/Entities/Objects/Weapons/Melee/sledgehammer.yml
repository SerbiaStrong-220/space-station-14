    sprite: SS220/Objects/Weapons/Melee/sledgehammer.rsi
    state: icon
  - type: EmitSoundOnLand
    sound:
      path: /Audio/SS220/Effects/Drop/sledgehammer.ogg
      params:
        volume: 2
  - type: Item
    size: Ginormous
  - type: Clothing
    sprite: SS220/Objects/Weapons/Melee/sledgehammer.rsi
