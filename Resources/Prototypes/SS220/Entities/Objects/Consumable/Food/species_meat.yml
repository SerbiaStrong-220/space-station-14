# Base

- type: entity
  abstract: true
  parent: FoodMeatRawBase
  id: FoodMeatSpeciesBase
  description: A slab of raw humanoid meat. Better not to ask whose.
  components:
  - type: Sprite
    sprite: SS220/Objects/Consumable/Food/species_meat.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 9
  - type: Item
    storedOffset: -2,1
    inhandVisuals:
      left:
      - state: plain-inhand-left
      right:
      - state: plain-inhand-right

- type: entity
  abstract: true
  parent: FoodMeatBase
  id: FoodMeatSpeciesCookedBase
  description: A cooked slab of humanoid meat. Smells disturbingly appetizing.
  components:
  - type: Tag
    tags:
    - Cooked
    - Meat
    - Steak
  - type: Sprite
    sprite: SS220/Objects/Consumable/Food/species_meat.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Protein
          Quantity: 5
  - type: Item
    storedOffset: -2,1
    inhandVisuals:
      left:
      - state: plain-cooked-inhand-left
      right:
      - state: plain-cooked-inhand-right

- type: entity
  abstract: true
  parent: FoodCutletBase
  id: FoodMeatSpeciesCutletBase
  description: A raw cutlet of humanoid meat.
  components:
  - type: Tag
    tags:
    - Raw
    - Cutlet
    - Meat
  - type: Sprite
    sprite: SS220/Objects/Consumable/Food/species_meat.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 3
        - ReagentId: Fat
          Quantity: 2
  - type: Item
    size: Tiny
    shape:
    - 0,0,0,0
    inhandVisuals:
      left:
      - sprite: Objects/Consumable/Food/meat.rsi
        state: generic-pink-inhand-left
      right:
      - sprite: Objects/Consumable/Food/meat.rsi
        state: generic-pink-inhand-right

- type: entity
  abstract: true
  parent: FoodMeatBase
  id: FoodMeatSpeciesCutletCookedBase
  description: A cooked cutlet of humanoid meat.
  components:
  - type: Tag
    tags:
    - Cooked
    - Cutlet
    - Meat
  - type: Sprite
    sprite: SS220/Objects/Consumable/Food/species_meat.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: Protein
          Quantity: 2
  - type: Item
    size: Tiny
    shape:
    - 0,0,0,0
    storedOffset: -1,1
    inhandVisuals:
      left:
      - sprite: Objects/Consumable/Food/meat.rsi
        state: generic-pink-inhand-left
      right:
      - sprite: Objects/Consumable/Food/meat.rsi
        state: generic-pink-inhand-right

# Vulpkanin

- type: entity
  parent: FoodMeatSpeciesBase
  id: FoodMeatVulpkanin
  name: raw vulpkanin meat
  components:
  - type: Sprite
    state: vulp
  - type: SliceableFood
    count: 3
    slice: FoodMeatVulpkaninCutlet
  - type: Grillable
    timeToCook: 30
    cookingResult: FoodMeatVulpkaninCooked

- type: entity
  parent: FoodMeatSpeciesCookedBase
  id: FoodMeatVulpkaninCooked
  name: vulpkanin steak
  components:
  - type: Sprite
    state: vulp-cooked
  - type: SliceableFood
    count: 3
    slice: FoodMeatVulpkaninCutletCooked

- type: entity
  parent: FoodMeatSpeciesCutletBase
  id: FoodMeatVulpkaninCutlet
  name: raw vulpkanin cutlet
  components:
  - type: Sprite
    state: vulp_cutlet
  - type: Grillable
    timeToCook: 10
    cookingResult: FoodMeatVulpkaninCutletCooked

- type: entity
  parent: FoodMeatSpeciesCutletCookedBase
  id: FoodMeatVulpkaninCutletCooked
  name: vulpkanin cutlet
  components:
  - type: Sprite
    state: vulp_cutlet-cooked
  - type: FoodSequenceElement
    entries:
      Burger: VulpkaninCutletBurger
      Taco: VulpkaninCutlet

