- type: entity
  abstract: true
  parent: BaseItem
  id: BaseBodyCamera
  name: body camera
  description: You will always be watched.
  components:
  - type: Sprite
    sprite: SS220/Objects/Tools/bodycam.rsi
    state: bodycam
  - type: Clothing
    sprite: SS220/Objects/Tools/bodycam.rsi
    quickEquip: false
    slots:
    - neck
  - type: Item
    size: Normal

  - type: UserInterface
    interfaces:
      enum.SurveillanceCameraSetupUiKey.Camera:
        type: SurveillanceCameraSetupBoundUi
  - type: WirelessNetworkConnection
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: SurveillanceBodyCameraSecurity
    transmitFrequencyId: SurveillanceCamera
  - type: SurveillanceCamera
    setupAvailableNetworks:
      - SurveillanceBodyCameraSecurity
    isOffable: true
    isOffableVisuals: true
  - type: SurveillanceCameraMicrophone
    range: 5
    blacklist:
      components:
      - SurveillanceCamera
      - SurveillanceCameraMonitor
      - RadioSpeaker

  - type: ActiveListener
    range: 5

  - type: StationAiVision
    enabled: true
    needsPower: false
  - type: Battery
    maxCharge: 720
    startingCharge: 720
  - type: ExaminableBattery
  - type: BodyCameraPower
  - type: Eye
  - type: DetectiveCamera
  - type: WearableCamera

  - type: Tag
    tags:
    - DetectiveCamera
    - WeaponRechargerWhitelist

- type: entity
  id: BodyCameraSecurity
  parent: BaseBodyCamera
  name: body camera
  description: Body camera with audio recording function. Allows recording audio and automatically creating their text transcriptions.
  components:
  - type: Sprite
    layers:
    - state: bodycam_empty
    - state: bodycam
      map: ["tape"]
      visible: true
  - type: SurveillanceCamera
    networkSet: true
    id: "surveillance-camera-bodycam"
    active: false
  - type: UseDelay
    delay: 1
  - type: TapeRecorder
    recordingOnly: true
    internalStorage: true
  - type: TapeCassette
    repairWhitelist: {}
  - type: GenericVisualizer
    visuals:
      enum.TapeRecorderVisuals.Mode:
        tape:
          Stopped: { state: "bodycam" }
          Recording: { state: "bodycam_recording" }
  - type: UserInterface
    interfaces:
      enum.SurveillanceCameraSetupUiKey.Camera:
        type: SurveillanceCameraSetupBoundUi
      enum.TapeRecorderUIKey.Key:
        type: TapeRecorderBoundUserInterface
  - type: ActivatableUI
    key: enum.TapeRecorderUIKey.Key
    requireActiveHand: false
    verbOnly: true
  - type: Appearance
