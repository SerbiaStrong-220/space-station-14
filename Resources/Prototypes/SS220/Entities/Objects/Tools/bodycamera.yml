- type: entity
  abstract: true
  parent: BaseItem
  id: BaseBodyCamera
  name: body camera
  description: You will always be watched.
  components:
  - type: Sprite
    sprite: SS220/Objects/Tools/bodycam.rsi
    state: bodycam
  - type: Clothing
    sprite: SS220/Objects/Tools/bodycam.rsi
    quickEquip: false
    slots:
    - neck
  - type: Item
    size: Normal

  - type: UserInterface
    interfaces:
      enum.SurveillanceCameraSetupUiKey.Camera:
        type: SurveillanceCameraSetupBoundUi
  - type: WirelessNetworkConnection
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: SurveillanceBodyCameraSecurity
    transmitFrequencyId: SurveillanceCamera
  - type: SurveillanceCamera
    setupAvailableNetworks:
      - SurveillanceBodyCameraSecurity
    isOffable: true
    isOffableVisuals: true
  - type: SurveillanceCameraMicrophone
    range: 5
    blacklist:
      components:
      - SurveillanceCamera
      - SurveillanceCameraMonitor
      - RadioSpeaker

  - type: ActiveListener
    range: 5

  - type: StationAiVision
  - type: Eye
  - type: DetectiveCamera
  - type: WearableCamera

  - type: Tag
    tags:
    - DetectiveCamera

- type: entity
  id: BodyCameraSecurity
  parent: BaseBodyCamera
  name: body camera
  description: Body camera with audio recording function. Allows recording audio and automatically creating their text transcriptions.
  components:
  - type: Sprite
    layers:
    - state: bodycam_empty
    - state: bodycam
      map: ["tape"]
      visible: false
  - type: SurveillanceCamera
    networkSet: true
    id: "surveillance-camera-bodycam"
    active: false
  - type: UseDelay
    delay: 1
  - type: TapeRecorder
    recordingOnly: true
  - type: GenericVisualizer
    visuals:
      enum.TapeRecorderVisuals.Mode:
        tape:
          Stopped: { state: "bodycam" }
          Recording: { state: "bodycam_recording" }
      enum.TapeRecorderVisuals.TapeInserted:
        tape:
          True: { visible: true }
          False: { visible: false }
  - type: ContainerContainer
    containers:
      cassette_tape: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cassette_tape:
        priority: 4
        whitelist:
          components:
          - FitsInTapeRecorder
        blacklist:
          tags:
          - CassetteTapeLargeCapacity
  - type: UserInterface
    interfaces:
      enum.SurveillanceCameraSetupUiKey.Camera:
        type: SurveillanceCameraSetupBoundUi
      enum.TapeRecorderUIKey.Key:
        type: TapeRecorderBoundUserInterface
  - type: ActivatableUI
    key: enum.TapeRecorderUIKey.Key
    requireActiveHand: false
    verbOnly: true
  - type: Appearance
