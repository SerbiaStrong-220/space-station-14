# Chaplain Time
- type: loadoutEffectGroup
  id: ChaplainSenior
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobChaplain
      time: 180000 #50 часов
  sponsorTierLoadoutEffects:
  - !type:GroupLoadoutEffect
    proto: SeniorDevTeamTier
  - !type:GroupLoadoutEffect
    proto: AdministratorSponsorTier

- type: loadoutEffectGroup
  id: ChaplainFollower
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobChaplain
      time: 72000 #20 часов
  sponsorTierLoadoutEffects:
  - !type:GroupLoadoutEffect
    proto: SeniorDevTeamTier
  - !type:GroupLoadoutEffect
    proto: AdministratorSponsorTier

# Neck

- type: loadout
  id: ChaplainNeckCloak
  effects:
  - !type:GroupLoadoutEffect
    proto: ChaplainSenior
  equipment:
    neck: ClothingNeckCloakEnby

- type: loadout
  id: ChaplainNeckGoldenCross
  equipment:
    neck: ClothingNeckGoldenCross

- type: loadout
  id: ChaplainNeckSilverCross
  equipment:
    neck: ClothingNeckSilverCross

# jumpsuit 

