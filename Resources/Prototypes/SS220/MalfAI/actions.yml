- type: entity
  parent: BaseAction
  id: ActionMalfAiMachineOverride
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: SS220/Interface/Actions/actions_malfai.rsi
      state: machine_override
    useDelay: 60
    checkCanInteract: false
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: EntityTargetAction
    whitelist:
      components:
      - MalfAiTargetable
    blacklist:
      components:
      - Item
      - MindContainer
      - NukeDisk
      - GravityGenerator
      - AnomalyGenerator
      - TegGenerator
      - TegCirculator
      - XenoArtifact
      - ActiveTimerTrigger
      - Explosive
      - NpcFactionMember
    event: !type:MalfAiMachineOverrideEvent
  - type: MalfAiMachineOverrideTuning
    damageType: Blunt
    damage: 10
    range: 1.2

- type: entity
  parent: BaseAction
  id: ActionMalfAiMachineOverload
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: SS220/Interface/Actions/actions_malfai.rsi
      state: machine_overload
    useDelay: 60
    checkCanInteract: false
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: EntityTargetAction
    whitelist:
      components:
      - MalfAiTargetable
    blacklist:
      components:
      - Item
      - MindContainer
      - NukeDisk
      - GravityGenerator
      - AnomalyGenerator
      - TegGenerator
      - TegCirculator
      - XenoArtifact
      - ActiveTimerTrigger
      - Explosive
      - NpcFactionMember
    event: !type:MalfAiMachineOverloadEvent
  - type: MalfAiMachineOverloadTuning
    explosionType: Minibomb
    totalIntensity: 30
    intensitySlope: 20
    maxIntensity: 20
    delaySeconds: 300
    beepIntervalSeconds: 1
    beepSound: /Audio/Effects/Cargo/buzz_two.ogg

- type: entity
  parent: BaseAction
  id: ActionMalfAiPowerSiphon
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: SS220/Interface/Actions/actions_malfai.rsi
      state: power_siphon
    useDelay: 300
    checkCanInteract: false
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: EntityTargetAction
    whitelist:
      components:
      - MalfAiTargetable
    blacklist:
      components:
      - Item
      - MindContainer
      - NukeDisk
      - GravityGenerator
      - AnomalyGenerator
      - TegGenerator
      - TegCirculator
      - XenoArtifact
      - ActiveTimerTrigger
      - Explosive
      - NpcFactionMember
    event: !type:MalfAiPowerSiphonEvent
  - type: MalfAiPowerSiphonTuning
    initialDraw: 50000
    rampPerSecond: 25000
    maxDraw: 10000000
    stallMinDraw: 200000
    stallRatio: 0.25
    stallTimeoutSeconds: 10

