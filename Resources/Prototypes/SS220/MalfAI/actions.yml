- type: entity
  parent: BaseAction
  id: ActionMalfAiHackApc
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: SS220/Interface/Actions/actions_malfai.rsi
      state: hack_apc
    useDelay: 5
    checkCanInteract: false
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: EntityTargetAction
    whitelist:
      components:
      - MalfAiHackable
    event: !type:MalfAiHackApcEvent

