- type: entity
  parent: BaseGameRule
  id: MalfAiRule
  components:
  - type: MalfAiRule

- type: entity
  parent: BaseGameRule
  id: MalfAiLockdownRule
  components:
  - type: StationEvent
    weight: 0
    duration: 90
  - type: MalfAiLockdown

- type: entity
  parent: BaseGameRule
  id: MalfAiDoomsdayRule
  components:
  - type: StationEvent
    weight: 0
  - type: MalfAiDoomsday

- type: entity
  id: MalfAiDoomsdayWave
  categories: [ HideSpawnMenu ]
  components:
  - type: MalfAiDoomsdayWave
    ringCount: 3
    ringDelay: 2
    shockDamage: 250
    electrocuteDamage: 40
    electrocuteSeconds: 2.5
    fxStep: 2.4
    fxCount: 6
  - type: Tag
    tags:
    - HideContextMenu
  - type: PointLight
    color: "#44BBFF"
    radius: 12
    energy: 5
    netsync: false
