- type: gameMap
  id: Stargate
  mapName: 'NSS Stargate'
  mapPath: /Maps/SS220/stargate.yml
  minPlayers: 0 # normal limit: 45
  maxRandomOffset: 0
  randomRotation: false
  stations:
    StarGate:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/SS220/Shuttles/emergency/emergency_stargate.yml
        - type: StationCargoShuttle
          path: /Maps/SS220/Shuttles/ss220-cargogate.yml
        - type: StationNameSetup
          mapNameTemplate: '{0} Stargate {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '-SS220'
        - type: StationJobs
          availableJobs:
            Passenger: [ -1, -1 ]
            #Command
            Captain: [ 1, 1 ]
            BlueShield: [ 1, 1 ]
