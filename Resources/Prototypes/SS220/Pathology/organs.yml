# Missing organs. Added when an organ is extracted and removed when one is inserted back.

- type: pathology
  id: MissingBrain
  name: pathology-missing-brain-name
  isSevere: true
  targetZone: Head
  missingOrgan: Brain
  operationRecommendation: pathology-missing-brain-operation
  definition:
  - description: pathology-missing-brain-description
    effects:
    # about 5 minutes to death: ~3.3 min to crit, then breathing stops and suffocation joins
    - !type:PathologyDamageEffect
      damage:
        types:
          Cellular: 0.5

- type: pathology
  id: MissingEyes
  name: pathology-missing-eyes-name
  examineDescription: pathology-missing-eyes-examine
  isSevere: true
  targetZone: Eyes
  missingOrgan: Eyes
  operationRecommendation: pathology-missing-eyes-operation
  definition:
  - description: pathology-missing-eyes-description
    trait: Blindness

