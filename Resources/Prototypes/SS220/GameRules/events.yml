- type: entity
  id: RandomMindShieldCombustion
  parent: BaseGameRule
  components:
  - type: StationEvent
    earliestStart: 20
    duration: 20
    minimumPlayers: 1
    maxOccurrences: 1
    weight: 1
  - type: MindShieldCombustionRule

- type: entity
  id: GravityGeneratorAnomaly
  parent: BaseGameRule
  components:
  - type: StationEvent
    weight: 4
    startAnnouncement: station-event-gravity-generator-anomaly-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
      params:
        volume: -4
    duration: 2
  - type: GameRule
    delay:
      min: 1
      max: 3
  - type: GravityGeneratorAnomalyRule

- type: entity
  id: VespiaSpawnHorde
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    playTTS: false
    startAnnouncement: station-event-vent-creatures-start-horde-announcement
    startAudio:
      path: /Audio/SS220/Announcements/lifesigns.ogg
      params:
        volume: -4
    earliestStart: 20
    minimumPlayers: 15
    weight: 5
    duration: 5
    maxDuration: 20
  - type: VentHordeRule
    table: !type:GroupSelector
      rolls: 4, 8
      children:
      - id: MobGiantFly

- type: entity
  id: VespiaSpiderSpawnHorde
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    playTTS: false
    startAnnouncement: station-event-vent-creatures-start-horde-announcement
    startAudio:
      path: /Audio/SS220/Announcements/lifesigns.ogg
      params:
        volume: -4
    earliestStart: 20
    minimumPlayers: 15
    weight: 5
    duration: 5
    maxDuration: 20
  - type: VentHordeRule
    table: !type:GroupSelector
      rolls: 4, 8
      children:
      - id: MobGiantSpiderAngry
      - id: MobGiantFly

