- type: markingsGroup
  id: None
  onlyGroupWhitelisted: true

- type: markingsGroup
  id: Undergarments
  limits:
    enum.HumanoidVisualLayers.UndergarmentTop:
      limit: 1
      required: false
      nudityDefault: [ UndergarmentTopTanktop ]
    enum.HumanoidVisualLayers.UndergarmentBottom:
      limit: 1
      required: false
      nudityDefault: [ UndergarmentBottomBoxers ]

- type: entity
  id: OrganBase
  name: organ
  abstract: true
  parent: BaseItem
  components:
  - type: Organ
  #SS220-surgery-update begin
  - type: TaintableOrgan
  #SS220-surgery-update end

- type: entity
  parent: OrganBase
  id: OrganBaseTorso
  name: torso
  abstract: true
  components:
  - type: Organ
    category: Torso
  - type: Sprite
    state: torso
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.Chest
    data:
      state: torso
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special

- type: entity
  parent: OrganBase
  id: OrganBaseHead
  name: head
  abstract: true
  components:
  - type: Organ
    category: Head
  #SS220-surgery-update begin
  - type: Limb
    attachedOrgans: [ Brain, Eyes, Tongue, Ears ]
  #SS220-surgery-update end
  - type: Sprite
    state: head
    #SS220-surgery-update begin
    # every body part is drawn off-center in its full-body frame, the fixed frame keeps the offset right while the item spins
    offset: 0, -0.3
    enableOverrideDir: true
    overrideDir: South
    #SS220-surgery-update end
  #SS220-surgery-update begin
  - type: SeveredOrganVisuals
  - type: Dismemberable
    hitThreshold: 25
    hitChance: 0.35
  - type: TaintableOrgan
    poisonsWhenRotten: true
  #SS220-surgery-update end
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.Head
    data:
      state: head
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    markingData:
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop

