- type: entity
  abstract: true
  parent:
  - BaseMob
  - MobCombat
  - MobDamageable
  - MobPolymorphable
  - StripableInventoryBase
  - BaseSpeciesAppearance
  id: BaseSpeciesMob
  save: false
  components:
  - type: DamageVisuals
    thresholds: [ 10, 20, 30, 50, 70, 100 ]
    targetLayers:
    - "enum.HumanoidVisualLayers.Chest"
    - "enum.HumanoidVisualLayers.Head"
    - "enum.HumanoidVisualLayers.LArm"
    - "enum.HumanoidVisualLayers.LLeg"
    - "enum.HumanoidVisualLayers.RArm"
    - "enum.HumanoidVisualLayers.RLeg"
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#FF0000"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: JobStatus
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: HumanoidProfile
  - type: TypingIndicator
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      80: 0.5
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 185
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FloorOcclusion
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MeatBulletImpact
    soundTypes:
      Heat:
        collection:
          MeatLaserImpact
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [Touch, Ingestion]
    reactions:
    - reagents: [Water, SpaceCleaner]
      methods: [Touch]
      effects:
      - !type:WashCreamPie
  - type: StatusEffects
    allowed:
    - Electrocution
    - RatvarianLanguage
    - PressureImmunity
    - Muted
    - TemporaryBlindness
    - Pacified
    - Flashed
    - Adrenaline
    #- TemporaryWaddle  #SS220 Temporary waddle status effect # UPD. SS220 Temporary remove
    - Rave #SS220 cult
    - ChemicalAdaptation #SS220 #3150
  - type: Identity
  - type: IdExaminable
  - type: Internals
  - type: FloatingVisuals
  - type: Climbing
  #SS220 eye offset begin
  - type: EyeCursorOffset
    maxOffset: 6
    pvsIncrease: 0.6
  - type: EyeOffsetInCombatMode
  #SS220 eye offset end
  - type: Cuffable
  - type: Ensnareable
    sprite: Objects/Misc/ensnare.rsi
    state: icon
  - type: AnimationPlayer
  - type: Buckle
  - type: CombatMode
    canDisarm: true
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 5
  - type: Tts # SS220 Tts
  - type: SleepEmitSound
  - type: SSDIndicator
  - type: StandingState
  - type: Crawler
  #SS220-surgery-update begin
  - type: OrganWornSlots
    slots:
      HandLeft: GLOVES
      HandRight: GLOVES
      FootLeft: FEET
      FootRight: FEET
      Head: [ HEAD, MASK, EYES, EARS ]
    masks:
      HandLeft:
        sizeMaps:
          32:
            sprite: SS220/Mobs/Species/limb_masks.rsi
            state: gloves-left
      HandRight:
        sizeMaps:
          32:
            sprite: SS220/Mobs/Species/limb_masks.rsi
            state: gloves-right
      FootLeft:
        sizeMaps:
          32:
            sprite: SS220/Mobs/Species/limb_masks.rsi
            state: shoes-left
      FootRight:
        sizeMaps:
          32:
            sprite: SS220/Mobs/Species/limb_masks.rsi
            state: shoes-right
  - type: Dismemberment
    # the chance is (damage - chanceOffset) * chancePerDamage, clamped to min/max
    hitRoll: # cuts + blows of a hit on a part with a severe trauma, from 15: 35-95%
      threshold: 15
      chanceOffset: 9.17
      chancePerDamage: 0.06
      minChance: 0.2
      maxChance: 0.95
    blastRoll: # blunt of an explosion after armor, from 20: 5-40% per part
      threshold: 20
      chanceOffset: 10
      chancePerDamage: 0.005
      minChance: 0.05
      maxChance: 0.4
    tearDamage:
      types:
        Slash: 20
    tearThrowMinDistance: 2
    tearThrowMaxDistance: 3
  #SS220-surgery-update end
  - type: Dna
  - type: MindContainer
  - type: MindExaminable
  - type: CanEnterCryostorage
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others
  - type: CanHostGuardian
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_human
  - type: ParcelWrapOverride
    parcelPrototype: WrappedParcelHumanoid
    wrapDelay: 5
  - type: Stripping
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      # SS220-surgery-update-begin
      enum.SurgeryEdgeSelectorUi.Key:
        type: EdgeSelectorBUI
      # SS220-surgery-update-end
  - type: Puller
  - type: Speech
    speechSounds: Alto
  - type: DamageForceSay
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: MaleHuman
  - type: Emoting
    chatEmoteCooldown: 5.0 #ss220 emote 5 sec
  - type: BodyEmotes
    soundsId: GeneralBodyEmotes
  - type: Grammar
    attributes:
      proper: true
  - type: MobPrice
    price: 1500 # Kidnapping a living person and selling them for cred is a good move.
    deathPenalty: 0.01 # However they really ought to be living and intact, otherwise they're worth 100x less.
  # SS220-MartialArts-Start
  - type: MartialArtist
  - type: MartialArtsTarget
  # SS220-MartialArts-End
  # SS220-Grabs-Start
  - type: Grabber
  - type: Grabbable
  - type: GrabResistance
  # SS220-Grabs-End
  - type: RandomPrice
    maxRandomPrice: 20000
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - ZombifyableByMelee
    - AnomalyHost

- type: entity
  abstract: true
  parent:
  - MobBloodstream
  - MobRespirator
  - MobAtmosStandard
  - MobFlammable
  - BaseSpeciesMob
  id: BaseSpeciesMobOrganic
  save: false
  components:
  - type: Hunger
  - type: Thirst
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.50
        Heat: 0.1
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      types:
        Heat: -0.07
        Blunt: -0.05
        Piercing: -0.05
        Slash: -0.05
  - type: Fingerprint
  - type: Blindable
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage
    heatDamageThreshold: 325
    coldDamageThreshold: 260
    coldDamage:
      types:
        Cold: 0.1 #per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 1.5 #per second, scales with temperature & other constants
  - type: TemperatureSpeed
    thresholds:
      293: 0.9
      280: 0.8
      260: 0.7
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
  - type: Perishable
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeat
      amount: 5
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1.0
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: FireVisuals
    alternateState: Standing
  - type: SurgeryPatient #SS220 Surgery
  - type: PathologyHolder #SS220 Pathology
    #SS220-surgery-update begin
    # traumas from one hit: from the threshold the chance is (damage - chanceOffset) * chancePerDamage, clamped to min/max
    dislocationRoll: # blunt 10-15: 5-30%
      threshold: 10
      chanceOffset: 9
      chancePerDamage: 0.05
      minChance: 0.05
      maxChance: 0.35
    hairlineFractureRoll: # blunt 15-20: 20-55%
      threshold: 15
      chanceOffset: 12.15
      chancePerDamage: 0.07
      minChance: 0.2
      maxChance: 0.55
    compoundFractureRoll: # blunt from 20: 50-90%
      threshold: 20
      chanceOffset: 5.71
      chancePerDamage: 0.035
      minChance: 0.5
      maxChance: 0.9
    arterialPunctureRoll: # slash + piercing from 18: 10-65%
      threshold: 18
      chanceOffset: 14
      chancePerDamage: 0.025
      minChance: 0.1
      maxChance: 0.65
    burnNecrosisRoll: # heat + caustic + shock from 10: 12-65%, a burn up to 25, necrosis from 26
      threshold: 10
      chanceOffset: 15
      chancePerDamage: 0.025
      minChance: 0.12
      maxChance: 0.65
      levelThresholds: [ 24 ]
    #SS220-surgery-update end
  - type: Experience # SS220 Experience update
  - type: StunVisuals
  - type: LimitationRevive #SS220 LimitationRevive
